name: Desktop native build

# Pre-release native verification is opt-in, outside the routine Linux gate.
on:
  workflow_dispatch:
    inputs:
      os:
        description: Desktop platform to verify
        type: choice
        default: all
        options: [all, macos-latest, windows-latest, ubuntu-24.04]

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["macos-latest","windows-latest","ubuntu-24.04"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tray/src-tauri -> target
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b packages/client-ts
      - run: pnpm --filter @ecs/tray check
      # These tests use generated service/process fixtures, never operator services.
      - run: cargo test --manifest-path apps/tray/src-tauri/Cargo.toml
      - run: pnpm --filter @ecs/tray tauri build --no-bundle
