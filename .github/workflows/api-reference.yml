name: Publish API reference

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/api-reference.yml
      - scripts/build-api-reference.mjs
      - packages/protocol/openapi/openapi.yaml
      - apps/server/package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-reference-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile --filter @ecs/server...
      - run: node scripts/build-api-reference.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/api-reference

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
