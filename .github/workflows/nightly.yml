name: Nightly distributions

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing version tag. Run on that tag to attach server packages to its GitHub release.'
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: Server (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64, extension: tar.gz }
          - { os: windows-latest, platform: windows, arch: x64, extension: zip }
          - { os: macos-15, platform: macos, arch: arm64, extension: tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ECS_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm ui
      - run: pnpm secret-scan
      - run: node --test scripts/test-desktop-package.mjs
      - name: Build self-contained server archive
        run: pnpm package:nightly
      - name: Smoke test extracted distribution
        shell: bash
        run: |
          tag="${ECS_RELEASE_TAG:-nightly}"
          node scripts/smoke-nightly.mjs "dist-release/$tag/Emulation-Server-${tag#v}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-release/${{ inputs.release_tag || 'nightly' }}/*
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.platform }}-${{ matrix.arch }})
    if: '!inputs.release_tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: windows-latest, platform: windows, arch: x64 }
          - { os: macos-15, platform: macos, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tray/src-tauri -> target
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b packages/client-ts
      - name: Check desktop interface and generated native fixtures
        run: pnpm --filter @ecs/tray check
      - run: cargo test --locked --manifest-path apps/tray/src-tauri/Cargo.toml
      - name: Build unsigned nightly installers
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          case "$RUNNER_OS" in
            Windows) pnpm --filter @ecs/tray tauri build --ci --bundles msi ;;
            Linux) pnpm --filter @ecs/tray tauri build --ci --bundles deb,appimage ;;
            macOS) pnpm --filter @ecs/tray tauri build --ci --bundles app && node scripts/package-macos.mjs ;;
          esac
      - name: Stage installers and checksums
        run: node scripts/publish-desktop.mjs nightly apps/tray/src-tauri/target/release/bundle --stage-only
      - uses: actions/upload-artifact@v4
        with:
          # Signing uses a separate job and receives only this run's artifact.
          name: ${{ runner.os == 'macOS' && 'test-desktop-macos-arm64' || format('desktop-{0}-{1}', matrix.platform, matrix.arch) }}
          path: dist-release/desktop/*
          if-no-files-found: error
          retention-days: 7

  sign_macos:
    name: Sign and notarize macOS installer
    needs: desktop
    if: >-
      !inputs.release_tag && github.ref == 'refs/heads/main' &&
      vars.ECS_NIGHTLY_MACOS_SIGNING == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    environment: nightly-macos-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: test-desktop-macos-arm64
          path: ${{ runner.temp }}/ecs-unsigned
      - name: Sign, notarize and verify this run's DMG
        shell: bash
        env:
          P12_BASE64: ${{ secrets.ECS_MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.ECS_MACOS_SIGNING_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ECS_MACOS_NOTARY_KEY }}
          ASC_KEY_ID: ${{ secrets.ECS_MACOS_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ECS_MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${P12_BASE64:?Missing ECS_MACOS_SIGNING_P12}"
          : "${P12_PASSWORD:?Missing ECS_MACOS_SIGNING_PASSWORD}"
          : "${ASC_KEY_P8:?Missing ECS_MACOS_NOTARY_KEY}"
          : "${ASC_KEY_ID:?Missing ECS_MACOS_NOTARY_KEY_ID}"
          : "${ASC_ISSUER_ID:?Missing ECS_MACOS_NOTARY_ISSUER_ID}"
          umask 077
          credentials=$(mktemp -d "$RUNNER_TEMP/ecs-signing.XXXXXX")
          keychain="$credentials/signing.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$credentials"
          }
          trap cleanup EXIT
          printf '%s' "$P12_BASE64" | base64 -D > "$credentials/identity.p12"
          printf '%s\n' "$ASC_KEY_P8" > "$credentials/notary.p8"
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          # codesign also consults the user search list when locating the private key.
          keychains=("$keychain")
          while IFS= read -r entry; do
            entry=$(printf '%s' "$entry" | sed -E 's/^[[:space:]]*"//; s/"$//')
            if [[ -n "$entry" && "$entry" != "$keychain" ]]; then
              keychains+=("$entry")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          security default-keychain -d user -s "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$credentials/identity.p12" -P "$P12_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          rm "$credentials/identity.p12"
          unset P12_BASE64 P12_PASSWORD ASC_KEY_P8 keychain_password
          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk '/Developer ID Application:/ {hash=$2; count++} END {if (count != 1) exit 1; print hash}')
          (cd "$RUNNER_TEMP/ecs-unsigned" && shasum -a 256 --check SHA256SUMS-desktop-darwin-arm64.txt)
          name=Emulation-Server-nightly-macos-arm64.dmg
          mkdir "$RUNNER_TEMP/ecs-signed"
          APPLE_SIGNING_IDENTITY="$identity" \
            ASC_KEY_PATH="$credentials/notary.p8" bash scripts/sign-nightly-macos.sh \
            "$RUNNER_TEMP/ecs-unsigned/$name" "$RUNNER_TEMP/ecs-signed/$name"
      - name: Stage notarized installer and checksum
        shell: bash
        run: node scripts/publish-desktop.mjs nightly "$RUNNER_TEMP/ecs-signed" --stage-only
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: dist-release/desktop/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions
    needs: [server, desktop, sign_macos]
    if: >-
      always() && needs.server.result == 'success' &&
      ((!inputs.release_tag && github.ref == 'refs/heads/main' && needs.desktop.result == 'success' &&
        (needs.sign_macos.result == 'success' || vars.ECS_NIGHTLY_MACOS_SIGNING != 'true')) ||
      (inputs.release_tag && github.ref == format('refs/tags/{0}', inputs.release_tag)))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: dist-release/all
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: '!inputs.release_tag'
        with:
          pattern: desktop-*
          path: dist-release/all
          merge-multiple: true
      - name: Verify complete release checksums
        working-directory: dist-release/all
        env:
          ECS_RELEASE_TAG: ${{ inputs.release_tag }}
          ECS_MACOS_SIGNED: ${{ needs.sign_macos.result == 'success' }}
        run: |
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          if test -n "$ECS_RELEASE_TAG"; then
            test "$(wc -l < SHA256SUMS.txt)" -eq 3
          elif test "$ECS_MACOS_SIGNED" = true; then
            test "$(wc -l < SHA256SUMS.txt)" -eq 7
            test -f Emulation-Server-nightly-macos-arm64.dmg
          else
            test "$(wc -l < SHA256SUMS.txt)" -eq 6
          fi
          test "$(find . -name 'ecs-update-*.json' | wc -l)" -eq 3
      - name: Attach server packages to the tagged release
        if: inputs.release_tag
        working-directory: dist-release/all
        env:
          GH_TOKEN: ${{ github.token }}
          ECS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$ECS_RELEASE_TAG" Emulation-Server-* SHA256SUMS-server-* ecs-update-*.json
      - name: Publish verified artifacts
        if: '!inputs.release_tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ECS_MACOS_SIGNED: ${{ needs.sign_macos.result == 'success' }}
        run: |
          # Runs on main serialize through the workflow concurrency group. Publish
          # this tested commit even if main advanced while installers were building.
          mac_note='The macOS desktop app retains the last notarized build.'
          if [[ "$ECS_MACOS_SIGNED" == true ]]; then
            mac_note='The macOS desktop app was Developer ID signed and Apple notarized from the same commit. On Apple Silicon, choose **Set up this Mac** to download and configure the local server.'
          fi
          cat > "$RUNNER_TEMP/nightly-notes.md" <<NOTES
          Automated test builds from commit $GITHUB_SHA.

          [Installation and testing guide](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/operations/nightly-builds.md)
          [Build and smoke-test evidence](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          **Desktop app** opens the library and connects to an existing server. **Standalone server** is the command-line package for the computer hosting the library. After extracting it, follow the [start commands](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/operations/nightly-builds.md#start-the-server).

          Linux and Windows desktop installers are unsigned. $mac_note

          Platforms: Linux x64 (Ubuntu 24.04), Windows x64, macOS arm64 (Apple Silicon). Other architectures and GUI interaction are unverified. Emulator cores, ROMs, BIOS files and user data are not included. Back up data before testing; database downgrades require restoring a backup.

          The nightly tag and automated packages refresh after a complete successful matrix. Verify your download against SHA256SUMS.txt on this release.
          NOTES
          if [[ "$ECS_MACOS_SIGNED" != true ]] && gh release view nightly >/dev/null 2>&1; then
            mac_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq '
              .assets[] | select(.name == "Emulation-Server-nightly-macos-arm64.dmg" and
                ((.label // "") | . == "macOS Apple Silicon · Notarized desktop app (.dmg)" or
                  startswith("macOS tray installer (notarized, "))) | .digest')
            if [[ "$mac_digest" =~ ^sha256:([0-9a-f]{64})$ ]]; then
              printf '%s  Emulation-Server-nightly-macos-arm64.dmg\n' "${BASH_REMATCH[1]}" >> dist-release/all/SHA256SUMS.txt
            fi
          fi
          assets=()
          for asset in dist-release/all/*; do
            case "${asset##*/}" in
              Emulation-Server-nightly-macos-arm64.dmg) asset="$asset#macOS Apple Silicon · Notarized desktop app (.dmg)" ;;
              Emulation-Server-nightly-macos-arm64.tar.gz) asset="$asset#macOS Apple Silicon · Standalone server (.tar.gz)" ;;
              Emulation-Server-nightly-windows-x64.msi) asset="$asset#Windows x64 · Desktop app (.msi)" ;;
              Emulation-Server-nightly-windows-x64.zip) asset="$asset#Windows x64 · Standalone server (.zip)" ;;
              Emulation-Server-nightly-linux-x64.AppImage) asset="$asset#Linux x64 · Desktop app (.AppImage)" ;;
              Emulation-Server-nightly-linux-x64.deb) asset="$asset#Linux x64 · Desktop app (.deb)" ;;
              Emulation-Server-nightly-linux-x64.tar.gz) asset="$asset#Linux x64 · Standalone server (.tar.gz)" ;;
            esac
            assets+=("$asset")
          done
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${assets[@]}" --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
            gh release edit nightly --title 'Emulation Server nightly' --notes-file "$RUNNER_TEMP/nightly-notes.md" --prerelease --latest=false
          else
            gh release create nightly "${assets[@]}" --target "$GITHUB_SHA" --title 'Emulation Server nightly' --notes-file "$RUNNER_TEMP/nightly-notes.md" --prerelease --latest=false
          fi
