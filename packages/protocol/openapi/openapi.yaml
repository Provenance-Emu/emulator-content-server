openapi: 3.1.0
info:
  title: Emulator Content Server API
  version: 1.0.0
  summary: Versioned content protocol for emulator libraries.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Process is serving.
  /openapi.yaml:
    get:
      operationId: getOpenApi
      responses:
        '200':
          description: This document.
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Protocol capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
  /api/v1/player/core:
    get:
      operationId: getPlayerCore
      description: Trusted browser core metadata. Requires an admitted actor with read permission.
      responses:
        '200':
          description: Configured core descriptor without operator filesystem paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCoreDescriptor'
        '401':
          description: Authentication required.
        '403':
          description: Read permission required.
        '404':
          description: Browser playback is not configured.
  /api/v1/systems:
    get:
      operationId: listSystems
      responses:
        '200':
          description: Known system vocabulary. The catalog is not closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemList'
  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrap
      responses:
        '201':
          description: Owner created.
  /api/v1/auth/login:
    post:
      operationId: login
      responses:
        '200':
          description: Session created.
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Session revoked.
  /api/v1/access:
    get:
      operationId: getAccess
      responses:
        '200':
          description: Who may use this server without a token, and whether this connection may.
    put:
      operationId: putAccess
      responses:
        '200':
          description: Access rule replaced.
  /api/v1/users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: Accounts on this server.
    post:
      operationId: createUser
      responses:
        '201':
          description: User created.
  /api/v1/users/{userId}:
    patch:
      operationId: setPassword
      responses:
        '204':
          description: Password replaced.
  /api/v1/browse:
    get:
      operationId: browseLibrary
      description: Bounded authorized collection. Exactly one of libraryId or unassigned=true is required. Unknown systems use systemId=unknown. Authorization and category filtering precede paging. Cursors bind normalized query and actor; changed or vanished anchors require refresh.
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
        - { name: unassigned, in: query, schema: { type: boolean }, description: Actual owner only. }
        - { name: category, in: query, required: true, schema: { type: string, enum: [games, saves, media, system_files] } }
        - { name: rootId, in: query, schema: { type: string } }
        - { name: systemId, in: query, schema: { type: string } }
        - { name: systemIds, in: query, description: Comma-separated system identifiers; OR selection; takes precedence over systemId., schema: { type: string, maxLength: 12000 } }
        - { name: search, in: query, schema: { type: string, maxLength: 256 } }
        - { name: sort, in: query, schema: { type: string, enum: [name_asc, name_desc], default: name_asc } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Authorized page; at most the requested limit. No absolute filesystem paths.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryBrowsePage' }
        '400': { description: Invalid query or cursor. Refresh after a changed anchor. }
        '401': { description: Authentication required. }
        '403': { description: Read scope or owner authority required. }
        '404': { description: Scope or folder unavailable. }
  /api/v1/browse-libraries:
    get:
      operationId: browseLibraries
      description: Libraries discoverable through membership or live readable item grants. canCreateItems reflects current create policy.
      responses:
        '200':
          description: Accessible libraries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryList' }
  /api/v1/root-summaries:
    get:
      operationId: rootSummaries
      description: Actual owner only. Cached counts and scan/check state; performs no probes or scans. Optional libraryId and unassigned=true filters are exclusive.
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
        - { name: unassigned, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Cached folder summaries; missing check means unknown availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRootSummaryList' }
        '400': { description: Invalid filter. }
        '403': { description: Actual owner authority required. }
  /api/v1/libraries/{libraryId}:
    patch:
      operationId: renameLibrary
      description: Actual owner only. Renames a library without moving content.
      parameters:
        - { name: libraryId, in: path, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: 'Revision validator "rev-N".' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryDraft' }
      responses:
        '200':
          description: Renamed library.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '409': { description: Revision conflict. }
        '428': { description: Revision validator required. }
        '403': { description: Actual owner authority required. }
        '404': { description: Library unavailable. }
  /api/v1/roots/{rootId}/library:
    put:
      operationId: assignRoot
      description: Actual owner only. Assigns an unassigned folder in place; idempotent for the same target, rejects moving an assigned folder.
      parameters:
        - { name: rootId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RootLibraryAssignment' }
      responses:
        '200':
          description: Assigned folder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRoot' }
        '409': { description: Folder already assigned elsewhere. }
        '403': { description: Actual owner authority required. }
        '404': { description: Library or folder unavailable. }
  /api/v1/libraries:
    get:
      operationId: listLibraries
      responses:
        '200':
          description: Visible libraries.
    post:
      operationId: createLibrary
      responses:
        '201':
          description: Library created.
  /api/v1/libraries/{libraryId}/members/{userId}:
    put:
      operationId: putMember
      responses:
        '204':
          description: Membership replaced.
    delete:
      operationId: deleteMember
      responses:
        '204':
          description: Membership removed.
  /api/v1/items:
    get:
      operationId: listItems
      responses:
        '200':
          description: Item page.
    post:
      operationId: createItem
      responses:
        '201':
          description: Item created.
  /api/v1/items/{itemId}:
    get:
      operationId: getItem
      responses:
        '200':
          description: Item.
    patch:
      operationId: patchItem
      responses:
        '200':
          description: Item updated.
    delete:
      operationId: deleteItem
      responses:
        '204':
          description: Item deleted.
  /api/v1/items/{itemId}/manifest:
    get:
      operationId: getManifest
      responses:
        '200':
          description: File manifest.
  /api/v1/items/{itemId}/access/{userId}:
    put:
      operationId: putItemAccess
      responses:
        '204':
          description: Item grant replaced.
    delete:
      operationId: deleteItemAccess
      responses:
        '204':
          description: Item grant removed.
  /api/v1/uploads:
    post:
      operationId: createUpload
      responses:
        '201':
          description: Upload session created.
  /api/v1/uploads/{uploadId}/content:
    put:
      operationId: uploadContent
      responses:
        '204':
          description: Bytes accepted.
  /api/v1/uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      responses:
        '201':
          description: Asset committed.
  /api/v1/uploads/{uploadId}:
    get:
      operationId: getUpload
      responses:
        '200':
          description: Received byte offset, so an interrupted upload can resume.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
    delete:
      operationId: abortUpload
      responses:
        '204':
          description: Upload aborted.
  /api/v1/files/{assetId}:
    get:
      operationId: getFileMetadata
      responses:
        '200':
          description: Asset metadata.
    delete:
      operationId: deleteFile
      responses:
        '204':
          description: Asset deleted.
  /api/v1/files/{assetId}/adopt:
    post:
      operationId: adoptFile
      responses:
        '200':
          description: The chosen save is now the live file at its path. The bytes it replaced stay beside it.
  /api/v1/files/{assetId}/content:
    get:
      operationId: getFileContent
      responses:
        '200':
          description: Full representation.
        '206':
          description: Single byte range.
    head:
      operationId: headFileContent
      responses:
        '200':
          description: Representation headers.
  /api/v1/files/{assetId}/entries:
    get:
      operationId: listVirtualEntries
      responses:
        '200':
          description: Virtual entries when a format provider exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualEntryList'
  /api/v1/files/{assetId}/entries/{entryId}/content:
    get:
      operationId: getVirtualEntryContent
      responses:
        '200':
          description: Full entry representation.
        '206':
          description: Single byte range of the entry.
    head:
      operationId: headVirtualEntryContent
      responses:
        '200':
          description: Entry representation headers.
  /api/v1/folders:
    get:
      operationId: browseFolders
      responses:
        '200':
          description: Directories inside one folder on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListing'
  /api/v1/webdav-credentials:
    get:
      operationId: listWebdavCredentials
      description: Account session only. Lists this account's credential metadata, never verifiers.
      responses:
        '200':
          description: Credentials including revoked entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebDavCredentialList'
    post:
      operationId: createWebdavCredential
      description: Account session only. Requires enabled WebDAV. Generates a read-only Digest app password shown once, without idempotency caching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebDavCredentialDraft'
      responses:
        '201':
          description: Credential issued. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebDavCredentialCreated'
  /api/v1/webdav-credentials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeWebdavCredential
      description: Account session only. Revokes a credential belonging to this account.
      responses:
        '204':
          description: Credential revoked.
  /api/v1/storage-locations:
    get:
      operationId: listStorageLocations
      description: Owner only. Includes server paths and current online status.
      responses:
        '200':
          description: Registered locations and the target for new bytes. Null means Primary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationList'
    post:
      operationId: createStorageLocation
      description: Owner only. Initializes blob storage in an existing server folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageLocationDraft'
      responses:
        '201':
          description: Location registered. Existing bytes are not moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocation'
  /api/v1/storage-locations/write-target:
    put:
      operationId: setStorageWriteTarget
      description: Owner only. Selects where new bytes are written; null selects Primary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageWriteTarget'
      responses:
        '200':
          description: Write target saved. An offline target refuses new uploads until online.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageWriteTarget'
  /api/v1/storage-locations/{locationId}:
    delete:
      operationId: deleteStorageLocation
      description: Owner only. Forgets an unused location without deleting files. The active target or a location holding catalog blobs returns 409.
      responses:
        '204':
          description: Location forgotten.
  /api/v1/roots:
    get:
      operationId: listContentRoots
      responses:
        '200':
          description: Saved content roots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRootList'
    post:
      operationId: createContentRoot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRootDraft'
      responses:
        '201':
          description: Content root saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRoot'
  /api/v1/roots/{rootId}:
    delete:
      operationId: deleteContentRoot
      responses:
        '204':
          description: Content root forgotten.
  /api/v1/roots/{rootId}/scan:
    post:
      operationId: scanContentRoot
      responses:
        '200':
          description: Folder read in place. Bytes stay where they are.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRootScan'
  /api/v1/sources:
    get:
      operationId: listSourceFiles
      responses:
        '200':
          description: Files found in content roots. Filesystem paths are not included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceFileList'
  /api/v1/sources/{sourceId}/content:
    get:
      operationId: readSourceContent
      responses:
        '200':
          description: Bytes of a local source file. Nothing is copied into the blob store.
    head:
      operationId: statSourceContent
      responses:
        '200':
          description: Size of a local source file.
  /api/v1/changes:
    get:
      operationId: listChanges
      responses:
        '200':
          description: Change feed.
  /api/v1/guest-grants:
    get:
      operationId: listGuestGrants
      responses:
        '200':
          description: Guest grants, including revoked ones. The token and its hash are omitted.
    post:
      operationId: createGuestGrant
      responses:
        '201':
          description: Guest grant created. The token is returned once.
  /api/v1/guest-grants/{grantId}:
    delete:
      operationId: revokeGuestGrant
      responses:
        '204':
          description: Guest grant revoked.
  /api/v1/device-tokens:
    post:
      operationId: createDeviceToken
      responses:
        '201':
          description: Device token created.
  /api/v1/device-tokens/{tokenId}:
    delete:
      operationId: revokeDeviceToken
      responses:
        '204':
          description: Device token revoked.
  /api/v1/audit:
    get:
      operationId: listAudit
      responses:
        '200':
          description: Audit events.
components:
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: [string, 'null'] }
        instance: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
    Capabilities:
      type: object
      required: [protocol, minClientVersion, features, limits, authentication]
      properties:
        protocol: { $ref: '#/components/schemas/ProtocolInfo' }
        minClientVersion: { type: string }
        features: { $ref: '#/components/schemas/FeatureFlags' }
        limits: { $ref: '#/components/schemas/Limits' }
        authentication:
          type: array
          items: { type: string }
        bootstrapped: { type: boolean }
    ProtocolInfo:
      type: object
      required: [major, minor, path]
      properties:
        major: { type: integer }
        minor: { type: integer }
        path: { type: string }
    FeatureFlags:
      type: object
      required: [rangeRequests, multiRange, resumableUploads, changeFeed, guestGrants, virtualFormats, webdav, natTraversal]
      properties:
        rangeRequests: { type: boolean }
        multiRange: { type: boolean }
        resumableUploads: { type: boolean }
        changeFeed: { type: boolean }
        guestGrants: { type: boolean }
        virtualFormats:
          type: array
          items: { type: string }
        webdav: { type: boolean }
        natTraversal: { type: boolean }
        webPlayback: { type: boolean }
    PlayerCoreResource:
      type: object
      required: [url, sha256, sizeBytes]
      properties:
        url: { type: string, description: Fixed same-origin protected resource path. }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 67108864 }
    PlayerCoreDescriptor:
      type: object
      required: [version, id, name, systems, runtime, threaded, filesystem, saveCompletion, frontendCommit, coreCommit, emscriptenVersion, contentExtension, maxContentBytes, loader, wasm]
      properties:
        version: { type: integer, enum: [1] }
        id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
        name: { type: string, maxLength: 80 }
        systems:
          type: array
          items: { type: string, enum: [com.provenance.nes] }
        runtime: { type: string, enum: [retroarch-emscripten-esm] }
        threaded: { type: boolean, enum: [false] }
        filesystem: { type: string, enum: [memfs] }
        saveCompletion: { type: string, enum: [command-reply-v1] }
        frontendCommit: { type: string, enum: [4d4bfc0fbaacca30d433e5c11b0b2b5242141b66] }
        coreCommit: { type: string, enum: [ac0d00a7fc01166f84c7bac01d1084ebfd2b865e] }
        emscriptenVersion: { type: string, enum: [3.1.46] }
        contentExtension: { type: string, enum: [nes] }
        maxContentBytes: { type: integer, format: int64, minimum: 1, maximum: 67108864 }
        loader: { $ref: '#/components/schemas/PlayerCoreResource' }
        wasm: { $ref: '#/components/schemas/PlayerCoreResource' }
    Limits:
      type: object
      required: [maxUploadBytes, maxPageSize]
      properties:
        maxUploadBytes: { type: integer, format: int64 }
        maxPageSize: { type: integer }
    SystemSummary:
      type: object
      required: [identifier, name]
      properties:
        identifier: { type: string }
        name: { type: string }
    SystemList:
      type: object
      required: [systems, closed]
      properties:
        systems:
          type: array
          items: { $ref: '#/components/schemas/SystemSummary' }
        closed: { type: boolean }
    Library:
      type: object
      required: [id, name, ownerId, revision, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        canCreateItems: { type: boolean, description: Present on browse-libraries; current permission to create global items. }
        ownerId: { type: string }
        revision: { type: integer }
        createdAt: { type: string }
    LibraryList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Library' }
        nextCursor: { type: [string, 'null'] }
    LibraryDraft:
      type: object
      required: [name]
      properties:
        name: { type: string }
    FolderEntry:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
    FolderPlace:
      type: object
      required: [label, path]
      properties:
        label:
          type: string
        path:
          type: string
    FolderListing:
      type: object
      required: [path, parent, entries, places]
      properties:
        path:
          type: string
        parent:
          type: [string, 'null']
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FolderEntry'
        places:
          type: array
          items:
            $ref: '#/components/schemas/FolderPlace'
    WebDavCredential:
      type: object
      required: [id, name, username, createdAt, expiresAt, revokedAt]
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    WebDavCredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WebDavCredential' }
    WebDavCredentialDraft:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expiresInSeconds: { type: integer, minimum: 60, maximum: 31536000, default: 7776000 }
    WebDavCredentialCreated:
      type: object
      required: [credential, password]
      properties:
        credential: { $ref: '#/components/schemas/WebDavCredential' }
        password: { type: string }
    StorageLocation:
      type: object
      required: [id, path, label, createdAt, online]
      properties:
        id: { type: string }
        path: { type: string }
        label: { type: string }
        createdAt: { type: string }
        online: { type: boolean }
    StorageLocationList:
      type: object
      required: [items, writeLocationId]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StorageLocation' }
        writeLocationId: { type: [string, 'null'] }
    StorageLocationDraft:
      type: object
      required: [path, label]
      properties:
        path: { type: string }
        label: { type: string }
    StorageWriteTarget:
      type: object
      required: [id]
      properties:
        id: { type: [string, 'null'] }
    ContentRoot:
      type: object
      required: [id, path, label, libraryId, createdAt]
      properties:
        id: { type: string }
        path: { type: string }
        label: { type: string }
        libraryId: { type: [string, 'null'] }
        createdAt: { type: string }
    ContentRootList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentRoot' }
        nextCursor: { type: [string, 'null'] }
    ContentRootDraft:
      type: object
      required: [path, label]
      properties:
        path: { type: string }
        label: { type: string }
        libraryId: { type: [string, 'null'] }
    ContentRootScan:
      type: object
      required: [rootId, medium, online, count]
      properties:
        rootId: { type: string }
        medium: { type: string }
        online: { type: boolean }
        count: { type: integer }
    SourceFile:
      type: object
      required:
        [id, rootId, libraryId, name, kind, size, systemId, availability, medium, contentPath]
      properties:
        id: { type: string }
        rootId: { type: string }
        libraryId: { type: [string, 'null'] }
        name: { type: string }
        kind: { type: string }
        size: { type: integer, format: int64 }
        systemId: { type: [string, 'null'] }
        availability: { type: string }
        medium: { type: string }
        contentPath: { type: string }
    SourceFileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SourceFile' }
    Item:
      type: object
      required: [id, libraryId, systemIdentifier, title, md5, crc, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        libraryId: { type: string }
        systemIdentifier: { type: string }
        title: { type: string }
        md5: { type: [string, 'null'] }
        crc: { type: [string, 'null'] }
        revision: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    ItemList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
