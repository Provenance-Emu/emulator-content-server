      type: object
      required: [supportedKinds, items]
      properties:
        supportedKinds:
          type: array
          items: { type: string, enum: [patch, mod, texture_pack] }
          description: Types implemented for this entity. An empty array means companions are unsupported.
        items:
          type: array
          items: { $ref: '#/components/schemas/GameCompanion' }
