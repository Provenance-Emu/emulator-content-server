      type: object
      required: [id, kind, required, filename, sizeBytes, sha256, contentPath]
      properties:
        id: { type: string }
        kind: { type: string, enum: [patch, mod, texture_pack], description: Only saved patches are currently served. }
        required: { type: boolean }
        filename: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        contentPath: { type: string }
        format: { type: string, description: Patch format such as ips, bps, or ups. }
        base: { $ref: '#/components/schemas/CompanionBase' }
    CompanionBase:
      type: object
      description: Expected input from the patch header. Its absence means a base hash is unavailable.
      required: [crc32, sizeBytes]
      properties:
        crc32: { type: string, pattern: '^[0-9a-f]{8}$' }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
