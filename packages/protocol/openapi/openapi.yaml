      description: Scanned disc-set members with portable relative paths. NAOMI and NAOMI 2 ZIP primaries include CHDs in the matching ZIP-stem directory. Check error and every member availability before downloading the full set. Cartridge-only ZIPs can remain standalone. Clients with authoritative GD-ROM metadata must verify the expected companion name.
