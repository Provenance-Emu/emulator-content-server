components:
  requestBodies:
    EmptyObject:
      required: true
      content:
        application/json:
          schema: { type: object, maxProperties: 0 }
          example: {}
  securitySchemes:
    workflowHostAuth:
      type: http
      scheme: bearer
      description: Scoped workflow host token returned by enrollment. Use it for assigned work, never owner approval.
    investigatorAuth:
      type: http
      scheme: bearer
      description: Short-lived investigator token scoped to specified libraries and operations.
    bearerAuth:
      type: http
      scheme: bearer
      description: Session, device or guest token. Some reads also allow tokenless access under the server's network policy.
  parameters:
    RevisionMatch:
      name: If-Match
      in: header
      required: true
      description: Revision ETag from the current item.
      schema: { type: string }
      example: '"rev-1"'
    UploadRange:
      name: Content-Range
      in: header
      description: Byte offset and total length for a resumable upload chunk.
      schema: { type: string }
      example: bytes 0-65535/131072
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated key. Reuse the same key and request body when retrying.
      schema: { type: string }
      example: example-upload-001
    Range:
      name: Range
      in: header
      description: Single byte range, such as bytes=0-65535.
      schema: { type: string }
      example: bytes=0-65535
    IfRange:
      name: If-Range
      in: header
      description: Strong ETag from the previous response. A mismatch returns the whole file with status 200.
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Return status 304 if this validator matches.
      schema: { type: string }
  headers:
    ETag:
      schema: { type: string }
    ContentLength:
      schema: { type: integer, format: int64 }
    ContentRange:
      schema: { type: string }
  responses:
    Content:
      description: Complete file.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Content-Length: { $ref: '#/components/headers/ContentLength' }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    PartialContent:
      description: Requested range of bytes.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Content-Length: { $ref: '#/components/headers/ContentLength' }
        Content-Range: { $ref: '#/components/headers/ContentRange' }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    ContentHeaders:
      description: File length and validator.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Content-Length: { $ref: '#/components/headers/ContentLength' }
    PartialContentHeaders:
      description: Headers for the selected byte range.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Content-Length: { $ref: '#/components/headers/ContentLength' }
        Content-Range: { $ref: '#/components/headers/ContentRange' }
    UnsatisfiableRange:
      description: Range is outside the file. Content-Range reports the current total size.
      headers:
        Content-Range: { $ref: '#/components/headers/ContentRange' }
  schemas:
    ServerUpdateSettings:
      type: object
      required: [channel, mode]
      properties:
        channel: { type: string, enum: [release, nightly] }
        mode: { type: string, enum: ['off', manual, automatic] }
    ServerUpdateDecision:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [check, install, later, skip] }
        buildId: { type: string }
    ServerUpdateBuild:
      type: object
      required: [id, version, channel]
      properties:
        id: { type: string }
        version: { type: string }
        channel: { type: string, enum: [release, nightly] }
        builtAt: { type: string, format: date-time }
    ServerUpdateHistoryEntry:
      type: object
      required: [build, at, outcome]
      properties:
        build: { $ref: '#/components/schemas/ServerUpdateBuild' }
        at: { type: string, format: date-time }
        outcome: { type: string, enum: [installed, observed, rolled-back] }
    ServerUpdateStatus:
      type: object
      required: [supported, settings, phase, prompt]
      properties:
        supported: { type: boolean }
        settings: { $ref: '#/components/schemas/ServerUpdateSettings' }
        current: { $ref: '#/components/schemas/ServerUpdateBuild' }
        available: { $ref: '#/components/schemas/ServerUpdateBuild' }
        phase: { type: string, enum: [idle, checking, downloading, restarting] }
        prompt: { type: boolean }
        message: { type: string }
        lastCheckedAt: { type: string, format: date-time, description: Last completed update check for the selected channel. }
        history:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ServerUpdateHistoryEntry' }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: [string, 'null'] }
        instance: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
    Capabilities:
      type: object
      required: [protocol, minClientVersion, features, limits, authentication]
      properties:
        protocol: { $ref: '#/components/schemas/ProtocolInfo' }
        minClientVersion: { type: string }
        features: { $ref: '#/components/schemas/FeatureFlags' }
        limits: { $ref: '#/components/schemas/Limits' }
        authentication:
          type: array
          items: { type: string }
        bootstrapped: { type: boolean }
    ProtocolInfo:
      type: object
      required: [major, minor, path]
      properties:
        major: { type: integer }
        minor: { type: integer }
        path: { type: string }
    FeatureFlags:
      type: object
      required: [rangeRequests, multiRange, resumableUploads, changeFeed, guestGrants, virtualFormats, webdav, natTraversal]
      properties:
        rangeRequests: { type: boolean }
        multiRange: { type: boolean }
        resumableUploads: { type: boolean }
        changeFeed: { type: boolean }
        guestGrants: { type: boolean }
        virtualFormats:
          type: array
          items: { type: string }
        webdav: { type: boolean }
        natTraversal: { type: boolean }
        webPlayback: { type: boolean }
        romDownloadSummaries: { type: boolean, description: Supports the opt-in ROM download summary on browse rows. }
        gameCompanions: { type: boolean, description: Supports companion discovery and authorized downloads. Inspect supportedKinds on each game. }
    PlayerCoreResource:
      type: object
      required: [url, sha256, sizeBytes]
      properties:
        url: { type: string, description: Fixed same-origin protected resource path. }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 67108864 }
    PlayerCoreDescriptor:
      type: object
      required: [version, id, name, systems, runtime, threaded, filesystem, saveCompletion, frontendCommit, coreCommit, emscriptenVersion, contentExtension, maxContentBytes, loader, wasm]
      properties:
        version: { type: integer, enum: [1] }
        id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
        name: { type: string, maxLength: 80 }
        systems:
          type: array
          items: { type: string, pattern: '^com\.provenance\.nes$' }
        runtime: { type: string, enum: [retroarch-emscripten-esm] }
        threaded: { type: boolean, not: { const: true }, description: Always false for this runtime. }
        filesystem: { type: string, enum: [memfs] }
        saveCompletion: { type: string, enum: [command-reply-v1] }
        frontendCommit: { type: string, enum: [4d4bfc0fbaacca30d433e5c11b0b2b5242141b66] }
        coreCommit: { type: string, enum: [ac0d00a7fc01166f84c7bac01d1084ebfd2b865e] }
        emscriptenVersion: { type: string, pattern: '^3\.1\.46$' }
        contentExtension: { type: string, enum: [nes] }
        maxContentBytes: { type: integer, format: int64, minimum: 1, maximum: 67108864 }
        loader: { $ref: '#/components/schemas/PlayerCoreResource' }
        wasm: { $ref: '#/components/schemas/PlayerCoreResource' }
    WebPlayerAsset:
      type: object
      required: [name, url, sha256, sizeBytes]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$' }
        url: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 33554432 }
    WebPlayerDescriptor:
      type: object
      required: [profileVersion, id, name, systems, runtime, filesystem, threaded, saveCompletion, contentExtensions, maxContentBytes, buildVersion, loader, wasm, assets]
      properties:
        profileVersion: { type: integer, enum: [1] }
        id: { type: string, maxLength: 120, pattern: '^(?:[a-z0-9][a-z0-9_-]{0,63}|[a-z0-9]+(?:\.[a-z0-9-]+)+)$' }
        name: { type: string, maxLength: 80 }
        systems: { type: array, items: { type: string }, minItems: 1, maxItems: 64 }
        runtime: { type: string, enum: [emscripten-esm-v1, retroarch-emscripten-esm, dolphin-wasm-esm] }
        filesystem: { type: string, enum: [memfs] }
        systemFilesDirectory: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$', maxLength: 64, description: Optional single folder below the emulator system directory for all named support files. }
        defaultInputLayout: { type: string, enum: [compact, standard], description: Default touch-controller preset. Saved user layouts take precedence. }
        defaultCoreOptions:
          type: object
          maxProperties: 64
          propertyNames: { pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$', not: { enum: [__proto__, constructor, prototype] } }
          additionalProperties: { type: string, minLength: 1, maxLength: 512, pattern: '^(?!\s)(?![\s\S]*\s$)[^"\\|\u0000-\u001f\u007f]+$' }
          description: RetroArch startup defaults. Saved user options take precedence. Keys exclude prototype names; values exclude controls, quotes, backslashes, pipes and surrounding whitespace.
        threaded: { type: boolean, description: True only for the isolated Dolphin runtime. }
        saveCompletion: { type: string, enum: [none, command-reply-v1] }
        contentExtensions: { type: array, items: { type: string }, minItems: 1, maxItems: 32 }
        maxContentBytes: { type: integer, format: int64, minimum: 1, maximum: 9663676416, description: "Up to 9 GiB for disk-backed Dolphin; other runtimes remain limited to 512 MiB." }
        buildVersion: { type: string, maxLength: 128 }
        loader: { $ref: '#/components/schemas/PlayerCoreResource' }
        wasm: { $ref: '#/components/schemas/PlayerCoreResource' }
        assets: { type: array, items: { $ref: '#/components/schemas/WebPlayerAsset' }, maxItems: 16 }
      allOf:
        - if: { required: [defaultCoreOptions] }
          then: { properties: { runtime: { const: retroarch-emscripten-esm } } }
        - if: { properties: { runtime: { const: dolphin-wasm-esm } } }
          then: { properties: { threaded: { const: true }, saveCompletion: { const: none } } }
          else: { properties: { threaded: { const: false } } }
    PlayerIsolationDraft:
      type: object
      additionalProperties: false
      required: [profileId]
      properties:
        profileId: { type: string, minLength: 1, maxLength: 120 }
    PlayerIsolationSession:
      type: object
      additionalProperties: false
      required: [id, url, expiresAt]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{48}$' }
        url: { type: string, format: uri, pattern: '^http://127\.0\.0\.1:[0-9]{1,5}/[a-f0-9]{48}/dolphin-sandbox\.html$' }
        expiresAt: { type: string, format: date-time }
    PlayerConfiguration:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        default: { type: boolean }
    PlayerInstallation:
      type: object
      required: [profile, enabled, source, removable]
      properties:
        profile: { $ref: '#/components/schemas/WebPlayerDescriptor' }
        enabled: { type: boolean }
        source: { type: string, enum: [managed, operator] }
        removable: { type: boolean }
    PlayerCatalogEntry:
      type: object
      required: [id, name, systems, description, available, reason, downloadBytes]
      properties:
        id: { type: string }
        name: { type: string }
        systems: { type: array, items: { type: string } }
        description: { type: string }
        available: { type: boolean }
        reason: { type: [string, 'null'] }
        downloadBytes: { type: [integer, 'null'] }
    PlayerManagement:
      type: object
      required: [items, defaultProfileId, available]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlayerInstallation' } }
        defaultProfileId: { type: [string, 'null'] }
        available: { type: array, items: { $ref: '#/components/schemas/PlayerCatalogEntry' } }
    WebPlayerCatalog:
      type: object
      required: [items, defaultProfileId]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WebPlayerDescriptor' }, maxItems: 64 }
        defaultProfileId: { type: [string, 'null'] }
    Limits:
      type: object
      required: [maxUploadBytes, maxPageSize]
      properties:
        maxUploadBytes: { type: integer, format: int64 }
        maxPageSize: { type: integer }
    SystemSummary:
      type: object
      required: [identifier, name]
      properties:
        identifier: { type: string }
        name: { type: string }
    SystemList:
      type: object
      required: [systems, closed]
      properties:
        systems:
          type: array
          items: { $ref: '#/components/schemas/SystemSummary' }
        closed: { type: boolean }
    Library:
      type: object
      required: [id, name, ownerId, revision, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        canCreateItems: { type: boolean, description: Present on browse-libraries; current permission to create global items. }
        ownerId: { type: string }
        revision: { type: integer }
        createdAt: { type: string }
    LibraryList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Library' }
        nextCursor: { type: [string, 'null'] }
    LibraryDraft:
      type: object
      required: [name]
      properties:
        name: { type: string }
    FolderEntry:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
    FolderPlace:
      type: object
      required: [label, path]
      properties:
        label:
          type: string
        path:
          type: string
    FolderListing:
      type: object
      required: [path, parent, entries, places]
      properties:
        path:
          type: string
        parent:
          type: [string, 'null']
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FolderEntry'
        places:
          type: array
          items:
            $ref: '#/components/schemas/FolderPlace'
    WebDavCredential:
      type: object
      required: [id, name, username, createdAt, expiresAt, revokedAt]
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    WebDavCredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WebDavCredential' }
    WebDavCredentialDraft:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expiresInSeconds: { type: integer, minimum: 60, maximum: 31536000, default: 7776000 }
    WebDavCredentialCreated:
      type: object
      required: [credential, password]
      properties:
        credential: { $ref: '#/components/schemas/WebDavCredential' }
        password: { type: string }
    StorageLocation:
      type: object
      required: [id, path, label, createdAt, online]
      properties:
        id: { type: string }
        path: { type: string }
        label: { type: string }
        createdAt: { type: string }
        online: { type: boolean }
    StorageLocationList:
      type: object
      required: [items, writeLocationId]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StorageLocation' }
        writeLocationId: { type: [string, 'null'] }
    StorageLocationDraft:
      type: object
      required: [path, label]
      properties:
        path: { type: string }
        label: { type: string }
    StorageWriteTarget:
      type: object
      required: [id]
      properties:
        id: { type: [string, 'null'] }
    ContentRoot:
      type: object
      required: [id, path, label, libraryId, createdAt]
      properties:
        id: { type: string }
        path: { type: string }
        label: { type: string }
        libraryId: { type: [string, 'null'] }
        createdAt: { type: string }
    ContentRootList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentRoot' }
        nextCursor: { type: [string, 'null'] }
    ContentRootDraft:
      type: object
      required: [path, label]
      properties:
        path: { type: string }
        label: { type: string }
        libraryId: { type: [string, 'null'] }
        watch: { type: boolean, description: Explicitly enable automatic watching for the new folder. }
        organize: { type: boolean, description: 'Explicitly enable in-place organization of ROMs, archives and complete disc groups on future match saves.' }
    ContentRootScan:
      type: object
      required: [rootId, medium, online, count]
      properties:
        rootId: { type: string }
        medium: { type: string }
        online: { type: boolean }
        count: { type: integer }
    SourceFile:
      type: object
      required:
        [id, rootId, libraryId, name, kind, size, systemId, availability, medium, contentPath]
      properties:
        id: { type: string }
        rootId: { type: string }
        libraryId: { type: [string, 'null'] }
        name: { type: string }
        kind: { type: string }
        size: { type: integer, format: int64 }
        systemId: { type: [string, 'null'] }
        availability: { type: string }
        medium: { type: string }
        title: { type: string }
        artworkAvailable: { type: boolean }
        artworkPath:
          type: string
          description: Present with artworkAvailable. Authenticated GET for the saved front cover; send If-None-Match with the returned ETag to revalidate.
        details: { $ref: '#/components/schemas/SourceDetails' }
        groupFileCount: { type: integer, minimum: 0, maximum: 512 }
        groupError: { type: [string, 'null'] }
        contentPath: { type: string }
    SourceDetails:
      type: object
      description: Saved game details for display. Every field is optional and absent until a match is saved.
      properties:
        publisher: { type: string }
        developer: { type: string }
        year: { type: string }
        genre: { type: string }
        region: { type: string }
        language: { type: string }
        description: { type: string, maxLength: 2000 }
    MatchingPlugin:
      type: object
      required: [id, name, kind, capabilities, network]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [provider, manager] }
        capabilities:
          type: array
          items: { type: string, enum: [rom, metadata, artwork, patch, cheats] }
        network: { type: boolean }
    MatchingPluginList:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          items: { $ref: '#/components/schemas/MatchingPlugin' }
    FolderWatchPolicy:
      type: object
      required: [rootId, enabled, state]
      properties:
        rootId: { type: string }
        enabled: { type: boolean }
        state: { type: string, enum: [off, watching, polling, offline, scanning, error] }
        lastScanAt: { type: string, format: date-time }
        warning: { type: string }
    FolderWatchPolicyDraft:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    SourceOrganizationPolicy:
      type: object
      required: [sourceRootId, enabled]
      properties:
        sourceRootId: { type: string }
        enabled: { type: boolean }
        mode: { type: string, enum: [copy, move] }
        targetRootId: { type: string }
        enabledAt: { type: string, format: date-time }
    SourceOrganizationPolicyDraft:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        planId: { type: string, description: Required when enabling. A current owner-bound folder or source organization preview. }
    FolderOrganizationPreview:
      type: object
      required: [planId, examples]
      properties:
        planId: { type: string }
        examples:
          type: array
          maxItems: 5
          items:
            type: object
            required: [sourceRelativePath, targetRelativePath]
            properties:
              sourceRelativePath: { type: string }
              targetRelativePath: { type: string }
    AutomaticOrganizationOutcome:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [copied, moved, synchronized, skipped, failed] }
        sourceId: { type: string }
