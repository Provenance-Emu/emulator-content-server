      required: [libraryId]
      properties:
        libraryId: { type: string }
    LibraryBrowseEntry:
      type: object
      description: entityType selects exactly one matching item, asset or source payload. parentItem is present only for asset entries; previewAsset only for item entries and is an authorized existing artwork asset. Flags reflect current endpoint permissions and are false where inapplicable.
      required: [entityType, id, name, libraryId, systemId, canUpload, canAdopt]
      properties:
        entityType: { type: string, enum: [item, asset, source] }
        id: { type: string }
        name: { type: string }
        libraryId: { type: [string, 'null'] }
        systemId: { type: [string, 'null'] }
        canUpload: { type: boolean }
        canAdopt: { type: boolean }
        item: { $ref: '#/components/schemas/Item' }
        asset: { $ref: '#/components/schemas/Asset' }
        source: { $ref: '#/components/schemas/SourceFile' }
        parentItem: { $ref: '#/components/schemas/Item' }
        previewAsset: { $ref: '#/components/schemas/Asset' }
        romDownload: { $ref: '#/components/schemas/RomDownloadSummary' }
    RomDownloadSummary:
      type: object
      description: Authorized uploaded-item ROM files. The single-file fields are omitted for empty and grouped results. A true requiresSystemFiles flag means this view also exposes a required BIOS or system file.
      required: [romFileCount, requiresSystemFiles]
      properties:
        romFileCount: { type: integer, minimum: 0 }
        requiresSystemFiles: { type: boolean }
        filename: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
