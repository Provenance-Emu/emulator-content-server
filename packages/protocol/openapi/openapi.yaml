        suggestions: {type: integer}
        error: {type: [string, 'null']}
    LibraryJobItemList:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/LibraryJobItem'}}
        nextCursor: {type: [string, 'null']}

    # Durable workflows are separate from existing scan/match jobs.
    WorkflowScope:
      type: object
      additionalProperties: false
      required: []
      properties:
