openapi: 3.1.2
info:
  title: Emulator Content Server API
  version: 1.0.0
  summary: Versioned content protocol for emulator libraries.
  description: |
    To run requests, open `/docs/` on your ECS server. Sign in to obtain a
    session token and enter it under Authorize without the Bearer prefix. Device
    and guest tokens only work within their assigned permissions. Investigator
    and workflow host operations have separate credentials.

    Example credentials and IDs are placeholders. Replace them with values
    returned by your own server. Trusted local connections may work without a
    token according to the server's access policy. Owner actions require the
    corresponding authority.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Discovery
  - name: Authentication
  - name: Access and credentials
  - name: Libraries and items
  - name: Uploads and downloads
  - name: Folders and sources
  - name: Matching and jobs
  - name: Players
  - name: Investigators
  - name: Workflow review
  - name: Workflow workers
  - name: Server and plugins
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Discovery]
      security: []
      responses:
        '200':
          description: Process is serving.
          content:
            application/json:
              example: {"ok": true}
              schema: {"type": "object", "required": ["ok"], "properties": {"ok": {"type": "boolean", "const": true}}}
  /openapi.yaml:
    get:
      operationId: getOpenApi
      tags: [Discovery]
      security: []
      responses:
        '200':
          description: This document.
          content:
            application/yaml:
              schema: {"type": "string"}
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [Discovery]
      security: []
      responses:
        '200':
          description: Protocol capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
  /api/v1/server/updates:
    get:
      operationId: getServerUpdates
      tags: [Server and plugins]
      description: Signed-in owner only. Server installation and update status.
      responses:
        '200':
          description: Update status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerUpdateStatus' }
    put:
      operationId: configureServerUpdates
      tags: [Server and plugins]
      description: Signed-in owner only. Select a GitHub server channel and update mode.
      requestBody:
        required: true
        content:
          application/json:
            example: {"channel": "release", "mode": "manual"}
            schema: { $ref: '#/components/schemas/ServerUpdateSettings' }
      responses:
        '200':
          description: Saved settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerUpdateStatus' }
    post:
      operationId: decideServerUpdate
      tags: [Server and plugins]
      description: Signed-in owner only. Check for updates or act on a specific build.
      requestBody:
        required: true
        content:
          application/json:
            example: {"action": "check"}
            schema: { $ref: '#/components/schemas/ServerUpdateDecision' }
      responses:
        '200':
          description: Current status. An installation can continue in the background.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerUpdateStatus' }
  /api/v1/plugins:
    get:
      operationId: getPluginManagement
      tags: [Server and plugins]
      description: Signed-in owner only. Managed native plugins and host health.
      responses:
        '200':
          description: Plugin installation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginManagement' }
    patch:
      operationId: configurePlugin
      tags: [Server and plugins]
      description: Signed-in owner only. Enable an installed immutable plugin version or disable its package.
      requestBody:
        required: true
        content:
          application/json:
            example: {"id": "org.ecs.example", "digest": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", "enabled": true}
            schema: { $ref: '#/components/schemas/PluginConfiguration' }
      responses:
        '200':
          description: Updated plugin state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginManagement' }
  /api/v1/plugins/defaults:
    post:
      operationId: installDefaultPlugins
      tags: [Server and plugins]
      description: Signed-in owner only. Install bundled native plugins and provision a scoped local workflow host.
      responses:
        '200':
          description: Installed plugins and host state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginManagement' }
  /api/v1/plugins/doctor:
    post:
      operationId: doctorPlugins
      tags: [Server and plugins]
      description: Signed-in owner only. Check packages, repair revoked host enrollment and resume the local plugin host.
      responses:
        '200':
          description: Checked plugin state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginManagement' }
  /api/v1/player/core:
    get:
      operationId: getPlayerCore
      tags: [Players]
      security: [{ bearerAuth: [] }, {}]
      description: Trusted browser core metadata. Requires an admitted actor with read permission.
      responses:
        '200':
          description: Configured core descriptor without operator filesystem paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCoreDescriptor'
        '401':
          description: Authentication required.
        '403':
          description: Read permission required.
        '404':
          description: Browser playback is not configured.
  /play/cores/{coreId}/loader.js:
    get:
      operationId: getPlayerCoreLoader
      tags: [Players]
      security: [{ bearerAuth: [] }, {}]
      description: JavaScript loader named by the trusted browser core descriptor. Requires read permission.
      parameters:
        - { name: coreId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: JavaScript loader bytes.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            text/javascript:
              schema: { type: string, format: binary }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
        '404': { description: Browser core is not available. }
  /play/cores/{coreId}/core.wasm:
    get:
      operationId: getPlayerCoreWasm
      tags: [Players]
      security: [{ bearerAuth: [] }, {}]
      description: WebAssembly module named by the trusted browser core descriptor. Requires read permission.
      parameters:
        - { name: coreId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: WebAssembly module bytes.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/wasm:
              schema: { type: string, format: binary }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
        '404': { description: Browser core is not available. }
  /api/v1/player/management:
    get:
      operationId: getPlayerManagement
      tags: [Players]
      description: Owner bearer only. Installed emulators and trusted installation catalog without server paths.
      responses:
        '200':
          description: Emulator installation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
        '401': { description: Authentication required. }
        '403': { description: Owner sign-in required. }
  /api/v1/player/management/install:
    post:
      operationId: installPlayerPackage
      tags: [Players]
      description: Owner bearer only. Bounded ECS player package with hash-verified data-only manifest and resources. Activates atomically without restart.
      requestBody:
        required: true
        content:
          application/vnd.ecs.player-package:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Installed and activated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
        '400': { description: Invalid or incompatible package. }
        '409': { description: Already installed or registry limit reached. }
  /api/v1/player/management/install/{id}:
    post:
      operationId: installCatalogPlayer
      tags: [Players]
      description: Owner bearer only. Install one pinned trusted catalog entry; arbitrary URLs are not accepted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Installed and activated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
        '404': { description: Catalog entry is not available. }
        '409': { description: Already installed. }
  /api/v1/player/management/{id}/system/{name}:
    put:
      operationId: installPlayerSystemFile
      tags: [Players]
      description: |
        Owner bearer only. Add or replace an operator-provided system file of
        1 byte to 32 MiB on a managed emulator with firmware support. Use a
        portable filename without a trailing period or a reserved name. An
        `awbios.zip` upload for `org.libretro.parallel-dc` must contain the
        131,072-byte `bios0.ic23` file. Installed firmware is shared with
        admitted players.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$' } }
      requestBody:
        required: true
        content:
          application/vnd.ecs.player-system-file:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Installed for the next launch without changing games or saves.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
        '400': { description: Invalid system-file archive or size. }
        '403': { description: Owner sign-in or managed emulator required. }
        '404': { description: Emulator is not installed. }
  /api/v1/player/management/{id}:
    patch:
      operationId: configurePlayer
      tags: [Players]
      description: Owner bearer only. Enable, disable or select the default emulator. Existing sessions keep their loaded bytes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            example: {"enabled": true, "default": true}
            schema: { $ref: '#/components/schemas/PlayerConfiguration' }
      responses:
        '200':
          description: Updated installation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
    delete:
      operationId: removePlayer
      tags: [Players]
      description: Owner bearer only. Remove a managed emulator installation. Operator-configured files are read-only; games and saves are preserved.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated installation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
  /api/v1/player/isolated-sessions:
    post:
      operationId: createPlayerIsolation
      tags: [Players]
      description: Read bearer required. Local HTTP browser only; actual socket peer, Host, and exact Origin must be loopback. Creates a bounded ten-minute companion listener serving only a fixed first-party bootstrap for an enabled threaded Dolphin profile. No credentials, content, API, or registry resources are served by that listener.
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            example: {"profileId": "org.libretro.dolphin"}
            schema: { $ref: '#/components/schemas/PlayerIsolationDraft' }
      responses:
        '201':
          description: Separate loopback origin and random fixed bootstrap route. Four active listeners globally and two per actor. Expired or closed sessions retain 404-only origins, up to 64 listeners per main-server lifetime, to prevent origin reuse while an old iframe may still run. All listeners close with the main server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerIsolationSession' }
        '400': { description: Invalid request body. }
        '401': { description: Bearer authentication required. }
        '403': { description: Read scope or local browser origin required. }
        '404': { description: Enabled compatible profile or fixed UI bootstrap unavailable. }
        '429': { description: Session or creation-rate limit reached. }
  /api/v1/player/isolated-sessions/{id}:
    delete:
      operationId: closePlayerIsolation
      tags: [Players]
      description: Close the caller actor's ephemeral local companion. Requires the same read bearer and local HTTP origin policy as creation. Foreign or expired session identifiers are not disclosed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{48}$' } }
        - { name: Origin, in: header, required: true, schema: { type: string } }
      responses:
        '204': { description: Session closed; origin retained as a 404-only tombstone until main-server shutdown. }
        '401': { description: Bearer authentication required. }
        '403': { description: Read scope or local browser origin required. }
        '404': { description: Session unavailable to this actor. }
  /api/v1/player/profiles:
    get:
      operationId: listPlayerProfiles
      tags: [Players]
      security: [{ bearerAuth: [] }, {}]
      description: Browser runtime profiles. Requires read permission.
      responses:
        '200':
          description: Configured profiles, empty when playback is disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebPlayerCatalog' }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
  /api/v1/player/profiles/{id}:
    get:
      operationId: getPlayerProfile
      tags: [Players]
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Immutable verified profile without operator paths.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebPlayerDescriptor' }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
        '404': { description: Profile is not configured. }
  /play/plugins/{id}/loader.js:
    get:
      operationId: getPlayerProfileLoader
      tags: [Players]
      security: [{ bearerAuth: [] }, {}]
      description: Authenticated immutable startup snapshot; requires read permission.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Hash-verified declared profile resource.
          content:
            text/javascript:
              schema: { type: string, format: binary }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
        '404': { description: Profile or resource is not configured. }
  /play/plugins/{id}/core.wasm:
    get:
      operationId: getPlayerProfileWasm
      tags: [Players]
      security: [{ bearerAuth: [] }, {}]
      description: Authenticated immutable startup snapshot; requires read permission.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Hash-verified declared profile resource.
          content:
            application/wasm:
              schema: { type: string, format: binary }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
        '404': { description: Profile or resource is not configured. }
  /play/plugins/{id}/assets/{name}:
    get:
      operationId: getPlayerProfileAsset
      tags: [Players]
      security: [{ bearerAuth: [] }, {}]
      description: Authenticated immutable startup snapshot; requires read permission.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Hash-verified declared profile resource.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
        '404': { description: Profile or resource is not configured. }
  /api/v1/systems:
    get:
      operationId: listSystems
      tags: [Discovery]
      security: []
      responses:
        '200':
          description: Known system vocabulary. The catalog is not closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemList'
  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrap
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"token": "REPLACE_WITH_BOOTSTRAP_TOKEN", "username": "library-owner", "password": "REPLACE_WITH_NEW_PASSWORD"}
            schema: { $ref: '#/components/schemas/BootstrapRequest' }
      responses:
        '201':
          description: Owner created.
          content:
            application/json:
              example: {"token": "REPLACE_WITH_RETURNED_SESSION_TOKEN", "tokenType": "Bearer", "userId": "user-demo", "expiresAt": "2026-11-10T20:00:00Z"}
              schema: { $ref: '#/components/schemas/SessionResponse' }
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"username": "library-owner", "password": "REPLACE_WITH_PASSWORD"}
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              example: {"token": "REPLACE_WITH_RETURNED_SESSION_TOKEN", "tokenType": "Bearer", "userId": "user-demo", "expiresAt": "2026-11-10T20:00:00Z"}
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { description: Username or password is incorrect. }
        '429': { description: Too many attempts. }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Session revoked.
  /api/v1/access:
    get:
      operationId: getAccess
      tags: [Access and credentials]
      security: []
      responses:
        '200':
          description: Who may use this server without a token, and whether this connection may.
          content:
            application/json:
              example: {"mode": "token", "subnets": [], "applies": true, "trusted": false, "manages": false}
              schema: {"$ref": "#/components/schemas/AccessPolicy"}
    put:
      operationId: putAccess
      tags: [Access and credentials]
      requestBody:
        required: true
        content:
          application/json:
            example: {"mode": "token", "subnets": []}
            schema: {"type": "object", "required": ["mode"], "properties": {"mode": {"type": "string", "enum": ["lan", "token", "subnets"]}, "subnets": {"type": "array", "items": {"type": "string"}}}}
      responses:
        '200':
          description: Access rule replaced.
          content:
            application/json:
              example: {"mode": "token", "subnets": [], "applies": true, "trusted": false, "manages": false}
              schema: {"$ref": "#/components/schemas/AccessPolicy"}
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [Access and credentials]
      responses:
        '200':
          description: Accounts on this server.
          content:
            application/json:
              schema: {"type": "object", "required": ["items"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/User"}}}}
    post:
      operationId: createUser
      tags: [Access and credentials]
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            example: {"username": "library-reader", "password": "REPLACE_WITH_NEW_PASSWORD"}
            schema: {"$ref": "#/components/schemas/UserDraft"}
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/User"}
  /api/v1/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: setPassword
      tags: [Access and credentials]
      requestBody:
        required: true
        content:
          application/json:
            example: {"password": "REPLACE_WITH_NEW_PASSWORD"}
            schema: {"type": "object", "required": ["password"], "properties": {"password": {"type": "string"}}}
      responses:
        '204':
          description: Password replaced.
  /api/v1/browse:
    get:
      operationId: browseLibrary
      tags: [Libraries and items]
      security: [{ bearerAuth: [] }, {}]
      description: Bounded authorized collection. Exactly one of libraryId or unassigned=true is required. Unknown systems use systemId=unknown. Authorization and category filtering precede paging. Cursors bind normalized query and actor; changed or vanished anchors require refresh.
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
        - { name: unassigned, in: query, schema: { type: boolean }, description: Actual owner only. }
        - { name: category, in: query, required: true, schema: { type: string, enum: [games, saves, media, system_files] } }
        - { name: rootId, in: query, schema: { type: string } }
        - { name: systemId, in: query, schema: { type: string } }
        - { name: systemIds, in: query, description: Comma-separated system identifiers; OR selection; takes precedence over systemId., schema: { type: string, maxLength: 12000 } }
        - { name: search, in: query, schema: { type: string, maxLength: 256 } }
        - { name: sort, in: query, schema: { type: string, enum: [name_asc, name_desc], default: name_asc } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: includeRomDownload, in: query, schema: { type: boolean, default: false }, example: true, description: 'Include authorized ROM download summaries on uploaded game rows. Scanned sources retain their existing filename, size and group fields.' }
      responses:
        '200':
          description: Authorized page; at most the requested limit. No absolute filesystem paths.
          content:
            application/json:
              example: {"items": [], "nextCursor": null}
              schema: { $ref: '#/components/schemas/LibraryBrowsePage' }
        '400': { description: Invalid query or cursor. Refresh after a changed anchor. }
        '401': { description: Authentication required. }
        '403': { description: Read scope or owner authority required. }
        '404': { description: Scope or folder unavailable. }
  /api/v1/browse-libraries:
    get:
      operationId: browseLibraries
      tags: [Libraries and items]
      security: [{ bearerAuth: [] }, {}]
      description: Libraries discoverable through membership or live readable item grants. canCreateItems reflects current create policy.
      responses:
        '200':
          description: Accessible libraries.
          content:
            application/json:
              example: {"items": [{"id": "library-demo", "name": "Retro games", "ownerId": "user-demo", "revision": 1, "createdAt": "2026-11-10T19:00:00Z", "canCreateItems": true}], "nextCursor": null}
              schema: { $ref: '#/components/schemas/LibraryList' }
  /api/v1/root-summaries:
    get:
      operationId: rootSummaries
      tags: [Folders and sources]
      description: Actual owner only. Cached counts and scan/check state; performs no probes or scans. Optional libraryId and unassigned=true filters are exclusive.
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
        - { name: unassigned, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Cached folder summaries; missing check means unknown availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRootSummaryList' }
        '400': { description: Invalid filter. }
        '403': { description: Actual owner authority required. }
  /api/v1/libraries/{libraryId}:
    patch:
      operationId: renameLibrary
      tags: [Libraries and items]
      description: Actual owner only. Renames a library without moving content.
      parameters:
        - { name: libraryId, in: path, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: 'Revision validator "rev-N".' }
      requestBody:
        required: true
        content:
          application/json:
            example: {"name": "Handheld games"}
            schema: { $ref: '#/components/schemas/LibraryDraft' }
      responses:
        '200':
          description: Renamed library.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '409': { description: Revision conflict. }
        '428': { description: Revision validator required. }
        '403': { description: Actual owner authority required. }
        '404': { description: Library unavailable. }
  /api/v1/roots/{rootId}/library:
    put:
      operationId: assignRoot
      tags: [Folders and sources]
      description: Actual owner only. Assigns an unassigned folder in place; idempotent for the same target, rejects moving an assigned folder.
      parameters:
        - { name: rootId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            example: {"libraryId": "library-demo"}
            schema: { $ref: '#/components/schemas/RootLibraryAssignment' }
      responses:
        '200':
          description: Assigned folder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRoot' }
        '409': { description: Folder already assigned elsewhere. }
        '403': { description: Actual owner authority required. }
        '404': { description: Library or folder unavailable. }
  /api/v1/libraries:
    get:
      operationId: listLibraries
      tags: [Libraries and items]
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200':
          description: Visible libraries.
          content:
            application/json:
              example: {"items": [{"id": "library-demo", "name": "Retro games", "ownerId": "user-demo", "revision": 1, "createdAt": "2026-11-10T19:00:00Z", "canCreateItems": true}], "nextCursor": null}
              schema: {"$ref": "#/components/schemas/LibraryList"}
    post:
      operationId: createLibrary
      tags: [Libraries and items]
      requestBody:
        required: true
        content:
          application/json:
            example: {"name": "Retro games"}
            schema: {"$ref": "#/components/schemas/LibraryDraft"}
      responses:
        '201':
          description: Library created.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Library"}
  /api/v1/libraries/{libraryId}/members:
    parameters:
      - { name: libraryId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listLibraryMembers
      tags: [Libraries and items]
      responses:
        '200':
          description: Library membership metadata, visible to library administrators.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryMemberList' }
  /api/v1/libraries/{libraryId}/members/{userId}:
    parameters:
      - { name: libraryId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      operationId: putMember
      tags: [Libraries and items]
      requestBody:
        required: true
        content:
          application/json:
            example: {"role": "reader"}
            schema: {"$ref": "#/components/schemas/MemberDraft"}
      responses:
        '204':
          description: Membership replaced.
    delete:
      operationId: deleteMember
      tags: [Libraries and items]
      responses:
        '204':
          description: Membership removed.
  /api/v1/items:
    get:
      operationId: listItems
      tags: [Libraries and items]
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { name: libraryId, in: query, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from the previous page. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Item page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemList' }
    post:
      operationId: createItem
      tags: [Libraries and items]
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            example: {"libraryId": "library-demo", "systemIdentifier": "com.provenance.nes", "title": "Example game"}
            schema: {"$ref": "#/components/schemas/ItemDraft"}
      responses:
        '201':
          description: Item created.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Item"}
  /api/v1/items/{itemId}:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getItem
      tags: [Libraries and items]
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200':
          description: Item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
    patch:
      operationId: patchItem
      tags: [Libraries and items]
      parameters:
        - {"$ref": "#/components/parameters/RevisionMatch"}
      requestBody:
        required: true
        content:
          application/json:
            example: {"title": "Example game (revised)"}
            schema: {"$ref": "#/components/schemas/ItemPatch"}
      responses:
        '200':
          description: Item updated.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Item"}
        '409': { description: Revision conflict. }
        '428': { description: Revision validator required. }
    delete:
      operationId: deleteItem
      tags: [Libraries and items]
      responses:
        '204':
          description: Item deleted.
  /api/v1/items/{itemId}/manifest:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getManifest
      tags: [Libraries and items]
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200':
          description: File manifest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
  /api/v1/items/{itemId}/companions:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string } }
    get:
      operationId: itemCompanions
      tags: [Libraries and items]
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200':
          description: Companion capabilities for an authorized uploaded item. Uploaded items currently expose no companion kinds.
          content:
            application/json:
              example: { supportedKinds: [], items: [] }
              schema: { $ref: '#/components/schemas/CompanionList' }
        '404': { description: Item unavailable to the caller. }
  /api/v1/items/{itemId}/access/{userId}:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      operationId: putItemAccess
      tags: [Libraries and items]
      requestBody:
        required: true
        content:
          application/json:
            example: {"permission": "read"}
            schema: {"$ref": "#/components/schemas/ItemAccessDraft"}
      responses:
        '204':
          description: Item grant replaced.
    delete:
      operationId: deleteItemAccess
      tags: [Libraries and items]
      responses:
        '204':
          description: Item grant removed.
  /api/v1/uploads:
    post:
      operationId: createUpload
      tags: [Uploads and downloads]
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            example: {"libraryId": "library-demo"}
            schema: {"type": "object", "required": ["libraryId"], "properties": {"libraryId": {"type": "string"}}}
      responses:
        '201':
          description: Upload session created.
          content:
            application/json:
              example: {"id": "upload-demo", "received": 0, "state": "open"}
              schema: {"$ref": "#/components/schemas/UploadSession"}
  /api/v1/uploads/{uploadId}/content:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    put:
      operationId: uploadContent
      tags: [Uploads and downloads]
      parameters:
        - {"$ref": "#/components/parameters/UploadRange"}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {"type": "string", "format": "binary"}
      responses:
        '204':
          description: Bytes accepted.
  /api/v1/uploads/{uploadId}/complete:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    post:
      operationId: completeUpload
      tags: [Uploads and downloads]
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            example: {"itemId": "item-demo", "kind": "rom", "displayName": "Example game", "relativePath": "Example.nes", "baseRevision": 1}
            schema: {"$ref": "#/components/schemas/UploadComplete"}
      responses:
        '201':
          description: Asset committed.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Asset"}
  /api/v1/uploads/{uploadId}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getUpload
      tags: [Uploads and downloads]
      responses:
        '200':
          description: Received byte offset, so an interrupted upload can resume.
          content:
            application/json:
              example: {"id": "upload-demo", "received": 65536, "state": "open"}
              schema:
                $ref: '#/components/schemas/UploadSession'
    delete:
      operationId: abortUpload
      tags: [Uploads and downloads]
      responses:
        '204':
          description: Upload aborted.
  /api/v1/files/{assetId}:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getFileMetadata
      tags: [Uploads and downloads]
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200':
          description: Asset metadata.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Asset"}
    delete:
      operationId: deleteFile
      tags: [Uploads and downloads]
      responses:
        '204':
          description: Asset deleted.
  /api/v1/files/{assetId}/adopt:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: string } }
    post:
      operationId: adoptFile
      tags: [Uploads and downloads]
      responses:
        '200':
          description: The chosen save is now the live file at its path. The bytes it replaced stay beside it.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Asset"}
  /api/v1/files/{assetId}/content:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/Range' }
      - { $ref: '#/components/parameters/IfRange' }
      - { $ref: '#/components/parameters/IfNoneMatch' }
    get:
      operationId: getFileContent
      tags: [Uploads and downloads]
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/Content' }
        '206': { $ref: '#/components/responses/PartialContent' }
        '304': { description: Representation unchanged. }
        '416': { $ref: '#/components/responses/UnsatisfiableRange' }
    head:
      operationId: headFileContent
      tags: [Uploads and downloads]
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/ContentHeaders' }
        '206': { $ref: '#/components/responses/PartialContentHeaders' }
        '304': { description: Representation unchanged. }
        '416': { $ref: '#/components/responses/UnsatisfiableRange' }
  /api/v1/files/{assetId}/entries:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listVirtualEntries
      tags: [Uploads and downloads]
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - {"name": "entry", "in": "query", "schema": {"type": "string"}, "description": "Optional virtual entry path to inspect."}
      responses:
        '200':
          description: Virtual entries when a format provider exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualEntryList'
  /api/v1/files/{assetId}/entries/{entryId}/content:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: string } }
      - { name: entryId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/Range' }
      - { $ref: '#/components/parameters/IfRange' }
      - { $ref: '#/components/parameters/IfNoneMatch' }
    get:
      operationId: getVirtualEntryContent
      tags: [Uploads and downloads]
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/Content' }
        '206': { $ref: '#/components/responses/PartialContent' }
        '304': { description: Representation unchanged. }
        '416': { $ref: '#/components/responses/UnsatisfiableRange' }
    head:
      operationId: headVirtualEntryContent
      tags: [Uploads and downloads]
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/ContentHeaders' }
        '206': { $ref: '#/components/responses/PartialContentHeaders' }
        '304': { description: Representation unchanged. }
        '416': { $ref: '#/components/responses/UnsatisfiableRange' }
  /api/v1/folders:
    get:
      operationId: browseFolders
      tags: [Folders and sources]
      parameters:
        - {"name": "path", "in": "query", "schema": {"type": "string"}, "description": "Absolute server folder path. Omit to list starting places."}
      responses:
        '200':
          description: Directories inside one folder on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListing'
  /api/v1/webdav-credentials:
    get:
      operationId: listWebdavCredentials
      tags: [Access and credentials]
      description: Account session only. Lists this account's credential metadata, never verifiers.
      responses:
        '200':
          description: Credentials including revoked entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebDavCredentialList'
    post:
      operationId: createWebdavCredential
      tags: [Access and credentials]
      description: Account session only. Requires enabled WebDAV. Generates a read-only Digest app password shown once, without idempotency caching.
      requestBody:
        required: true
        content:
          application/json:
            example: {"name": "Media reader", "expiresInSeconds": 86400}
            schema:
              $ref: '#/components/schemas/WebDavCredentialDraft'
      responses:
        '201':
          description: Credential issued. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebDavCredentialCreated'
  /api/v1/webdav-credentials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeWebdavCredential
      tags: [Access and credentials]
      description: Account session only. Revokes a credential belonging to this account.
      responses:
        '204':
          description: Credential revoked.
  /api/v1/storage-locations:
    get:
      operationId: listStorageLocations
      tags: [Folders and sources]
      description: Owner only. Includes server paths and current online status.
      responses:
        '200':
          description: Registered locations and the target for new bytes. Null means Primary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationList'
    post:
      operationId: createStorageLocation
      tags: [Folders and sources]
      description: Owner only. Initializes blob storage in an existing server folder.
      requestBody:
        required: true
        content:
          application/json:
            example: {"path": "/srv/ecs-storage", "label": "Secondary drive"}
            schema:
              $ref: '#/components/schemas/StorageLocationDraft'
      responses:
        '201':
          description: Location registered. Existing bytes are not moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocation'
  /api/v1/storage-locations/write-target:
    put:
      operationId: setStorageWriteTarget
      tags: [Folders and sources]
      description: Owner only. Selects where new bytes are written; null selects Primary.
      requestBody:
        required: true
        content:
          application/json:
            example: {"id": null}
            schema:
              $ref: '#/components/schemas/StorageWriteTarget'
      responses:
        '200':
          description: Write target saved. An offline target refuses new uploads until online.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageWriteTarget'
  /api/v1/storage-locations/{locationId}:
    parameters:
      - { name: locationId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteStorageLocation
      tags: [Folders and sources]
      description: Owner only. Forgets an unused location without deleting files. The active target or a location holding catalog blobs returns 409.
      responses:
        '204':
          description: Location forgotten.
  /api/v1/roots:
    get:
      operationId: listContentRoots
      tags: [Folders and sources]
      responses:
        '200':
          description: Saved content roots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRootList'
    post:
      operationId: createContentRoot
      tags: [Folders and sources]
      requestBody:
        required: true
        content:
          application/json:
            example: {"path": "/srv/roms", "label": "Game files", "libraryId": "library-demo", "watch": false, "organize": false}
            schema:
              $ref: '#/components/schemas/ContentRootDraft'
      responses:
        '201':
          description: Content root saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRoot'
  /api/v1/roots/{rootId}:
    parameters:
      - { name: rootId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteContentRoot
      tags: [Folders and sources]
      responses:
        '204':
          description: Content root forgotten.
  /api/v1/roots/{rootId}/scan:
    parameters:
      - { name: rootId, in: path, required: true, schema: { type: string } }
    post:
      operationId: scanContentRoot
      tags: [Folders and sources]
      responses:
        '200':
          description: Folder read in place. Bytes stay where they are.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRootScan'
  /api/v1/sources:
    get:
      operationId: listSourceFiles
      tags: [Folders and sources]
      security: [{ bearerAuth: [] }, {}]
      responses:
        '200':
          description: Files found in content roots. Filesystem paths are not included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceFileList'
  /api/v1/matching/plugins:
    get:
      operationId: matchingPlugins
      tags: [Matching and jobs]
      responses:
        '200':
          description: Owner-only provider and manager registry. Installed modules are not executed by discovery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchingPluginList' }
  /api/v1/roots/{rootId}/watching-policy:
    parameters:
      - { name: rootId, in: path, required: true, schema: { type: string } }
    get:
      operationId: folderWatchPolicy
      tags: [Folders and sources]
      responses:
        '200':
          description: Owner-only watching preference and live status for a registered server folder. Disabled by default. Internal filesystem paths are not exposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderWatchPolicy' }
    put:
      operationId: setFolderWatchPolicy
      tags: [Folders and sources]
      requestBody:
        required: true
        content:
          application/json:
            example: {"enabled": true}
            schema: { $ref: '#/components/schemas/FolderWatchPolicyDraft' }
      responses:
        '200':
          description: Persist explicit owner consent and start or stop watching this server folder. Watching refreshes the index and fills missing metadata and artwork. An enabled organization policy may move games after matching. Enable both registered folders to track moves between them. Periodic recovery scans handle missed events and unavailable native watches. Preference survives restart; runtime status does not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderWatchPolicy' }
  /api/v1/roots/{rootId}/organization-policy:
    parameters:
      - { name: rootId, in: path, required: true, schema: { type: string } }
    get:
      operationId: sourceOrganizationPolicy
      tags: [Folders and sources]
      responses:
        '200':
          description: Owner-only automatic organization policy for a registered source folder. Disabled by default. Internal filesystem paths are not exposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceOrganizationPolicy' }
    put:
      operationId: setSourceOrganizationPolicy
      tags: [Folders and sources]
      requestBody:
        required: true
        content:
          application/json:
            example: {"enabled": true, "planId": "REPLACE_WITH_PREVIEW_ID"}
            schema: { $ref: '#/components/schemas/SourceOrganizationPolicyDraft' }
      responses:
        '200':
          description: Owner explicitly enables organization for future successful ROM, metadata and artwork match saves using a current folder or source preview. Enabling does not process existing files. Disable at any time with enabled false. Policy fails closed if either folder changes library or path. Copy retains one verified owned copy and synchronizes later saved snapshots; move retains source identity. Unsupported files, stale sources and collisions leave saved matches intact and return an automatic organization warning.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceOrganizationPolicy' }
        '409':
          description: Preview expired or changed. Create a new preview before enabling.
  /api/v1/roots/{rootId}/organization-policy/preview:
    parameters:
      - { name: rootId, in: path, required: true, schema: { type: string } }
    post:
      operationId: previewFolderOrganization
      tags: [Folders and sources]
      requestBody:
        required: true
        content:
          application/json:
            example: {"mode": "copy", "targetRootId": "root-demo"}
            schema: { $ref: '#/components/schemas/SourceOrganizationDraft' }
      responses:
        '200':
          description: Owner-only preview of a future folder policy, with up to five example paths based on indexed ROMs, archives and complete disc groups. The owner-bound plan expires after ten minutes. Files are checked individually when a match triggers organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderOrganizationPreview' }
        '409':
          description: The selected folders or action do not support automatic organization.
  /api/v1/sources/{sourceId}/organization/preview:
    parameters:
      - { name: sourceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: previewSourceOrganization
      tags: [Folders and sources]
      requestBody:
        required: true
        content:
          application/json:
            example: {"mode": "copy", "targetRootId": "root-demo"}
            schema: { $ref: '#/components/schemas/SourceOrganizationDraft' }
      responses:
        '200':
          description: Owner-only, read-only preview for a local ROM, intact archive or complete disc game set. Destination is generated from system, saved title and original filename, within a registered root in the same library (including unassigned roots). Every member and companion is included in the preview. Descriptor references, relative layout and archive contents are preserved. Copy supports different volumes; move requires the same volume. Preview is bound to owner, source, roots, saved matches and file validators, expires after ten minutes and may be discarded when the bounded preview cache fills. Preview itself does not organize files. A separate explicit root policy can enable automatic organization on future saved matches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceOrganizationPreview' }
        '409':
          description: Unsupported source, changed source, destination collision or cross-volume move. Preview again after resolving the conflict.
  /api/v1/sources/{sourceId}/organization/apply:
    parameters:
      - { name: sourceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: applySourceOrganization
      tags: [Folders and sources]
      requestBody:
        required: true
        content:
          application/json:
            example: {"planId": "REPLACE_WITH_PREVIEW_ID"}
            schema: { $ref: '#/components/schemas/SourceOrganizationApply' }
      responses:
        '200':
          description: Applies exactly the owner's single-use preview with exclusive no-overwrite placement and revalidation. Move retains the source ID and saved match snapshots. Copy creates a source with cloned selections and leaves the original intact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceOrganizationResult' }
        '409':
          description: Preview expired, consumed, or changed. No new paths are accepted. Preview again.
  /api/v1/sources/{sourceId}/matches:
    parameters:
      - { name: sourceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: findSourceMatches
      tags: [Matching and jobs]
      requestBody:
        required: true
        content:
          application/json:
            example: {"online": false, "checksum": true, "autoSave": false}
            schema: { $ref: '#/components/schemas/MatchingOptions' }
      responses:
        '200':
          description: Owner-requested suggestions from local and online providers. With autoSave enabled, unique best-confidence choices are saved and enabled organization rules may run. Suggestions expire after fifteen minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMatches' }
  /api/v1/sources/{sourceId}/matches/selections:
    parameters:
      - { name: sourceId, in: path, required: true, schema: { type: string } }
    get:
      operationId: sourceMatchSelections
      tags: [Matching and jobs]
      parameters:
        - { name: includeArtworkRoles, in: query, schema: { type: boolean, default: false }, description: Include all artwork roles; older clients should keep the default front-only result. }
      responses:
        '200':
          description: Saved matches visible to the source reader. Selected metadata becomes game metadata; binary companions retain their source-kind access restrictions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMatchSelections' }
    put:
      operationId: saveSourceMatch
      tags: [Matching and jobs]
      parameters:
        - { name: includeArtworkRoles, in: query, schema: { type: boolean, default: false }, description: Include all artwork roles in the response; older clients should keep the default front-only result. }
      requestBody:
        required: true
        content:
          application/json:
            example: {"requestId": "REPLACE_WITH_MATCH_REQUEST_ID", "candidateId": "REPLACE_WITH_CANDIDATE_ID", "expectedRevision": 0}
            schema: { $ref: '#/components/schemas/SourceMatchSelectionDraft' }
      responses:
        '200':
          description: Owner-selected match and optional immutable content snapshot persisted. A repeated candidate ID is idempotent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMatchSelections' }
        '409':
          description: Revision conflict or source/companion changed since lookup.
  /api/v1/sources/{sourceId}/matches/lookup-hints:
    parameters:
      - { name: sourceId, in: path, required: true, schema: { type: string } }
    put:
