openapi: 3.1.0
info:
  title: Emulator Content Server API
  version: 1.0.0
  summary: Versioned content protocol for emulator libraries.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Process is serving.
  /openapi.yaml:
    get:
      operationId: getOpenApi
      responses:
        '200':
          description: This document.
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Protocol capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
  /api/v1/player/core:
    get:
      operationId: getPlayerCore
      description: Trusted browser core metadata. Requires an admitted actor with read permission.
      responses:
        '200':
          description: Configured core descriptor without operator filesystem paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCoreDescriptor'
        '401':
          description: Authentication required.
        '403':
          description: Read permission required.
        '404':
          description: Browser playback is not configured.
  /api/v1/player/management:
    get:
      operationId: getPlayerManagement
      description: Owner bearer only. Installed emulators and trusted installation catalog without server paths.
      responses:
        '200':
          description: Emulator installation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
        '401': { description: Authentication required. }
        '403': { description: Owner sign-in required. }
  /api/v1/player/management/install:
    post:
      operationId: installPlayerPackage
      description: Owner bearer only. Bounded ECS player package with hash-verified data-only manifest and resources. Activates atomically without restart.
      requestBody:
        required: true
        content:
          application/vnd.ecs.player-package:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Installed and activated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
        '400': { description: Invalid or incompatible package. }
        '409': { description: Already installed or registry limit reached. }
  /api/v1/player/management/install/{id}:
    post:
      operationId: installCatalogPlayer
      description: Owner bearer only. Install one pinned trusted catalog entry; arbitrary URLs are not accepted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Installed and activated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
        '404': { description: Catalog entry is not available. }
        '409': { description: Already installed. }
  /api/v1/player/management/{id}/system/{name}:
    put:
      operationId: installPlayerSystemFile
      description: Owner bearer only. Add or replace operator-provided awbios.zip on the managed Dreamcast/arcade core. ZIP must contain bios0.ic23 (131072bytes). Shared with admitted players; firmware is never downloaded for the operator.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string, enum: [awbios.zip] } }
      requestBody:
        required: true
        content:
          application/vnd.ecs.player-system-file:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Installed for the next launch without changing games or saves.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
        '400': { description: Invalid system-file archive or size. }
        '403': { description: Owner sign-in or managed emulator required. }
  /api/v1/player/management/{id}:
    patch:
      operationId: configurePlayer
      description: Owner bearer only. Enable, disable or select the default emulator. Existing sessions keep their loaded bytes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerConfiguration' }
      responses:
        '200':
          description: Updated installation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
    delete:
      operationId: removePlayer
      description: Owner bearer only. Remove a managed emulator installation. Operator-configured files are read-only; games and saves are preserved.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated installation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerManagement' }
  /api/v1/player/isolated-sessions:
    post:
      operationId: createPlayerIsolation
      description: Read bearer required. Local HTTP browser only; actual socket peer, Host, and exact Origin must be loopback. Creates a bounded ten-minute companion listener serving only a fixed first-party bootstrap for an enabled threaded Dolphin profile. No credentials, content, API, or registry resources are served by that listener.
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerIsolationDraft' }
      responses:
        '201':
          description: Separate loopback origin and random fixed bootstrap route. Four active listeners globally and two per actor. Expired or closed sessions retain 404-only origins, up to 64 listeners per main-server lifetime, to prevent origin reuse while an old iframe may still run. All listeners close with the main server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerIsolationSession' }
        '400': { description: Invalid request body. }
        '401': { description: Bearer authentication required. }
        '403': { description: Read scope or local browser origin required. }
        '404': { description: Enabled compatible profile or fixed UI bootstrap unavailable. }
        '429': { description: Session or creation-rate limit reached. }
  /api/v1/player/isolated-sessions/{id}:
    delete:
      operationId: closePlayerIsolation
      description: Close the caller actor's ephemeral local companion. Requires the same read bearer and local HTTP origin policy as creation. Foreign or expired session identifiers are not disclosed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{48}$' } }
        - { name: Origin, in: header, required: true, schema: { type: string } }
      responses:
        '204': { description: Session closed; origin retained as a 404-only tombstone until main-server shutdown. }
        '401': { description: Bearer authentication required. }
        '403': { description: Read scope or local browser origin required. }
        '404': { description: Session unavailable to this actor. }
  /api/v1/player/profiles:
    get:
      operationId: listPlayerProfiles
      description: Browser runtime profiles. Requires read permission.
      responses:
        '200':
          description: Configured profiles, empty when playback is disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebPlayerCatalog' }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
  /api/v1/player/profiles/{id}:
    get:
      operationId: getPlayerProfile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Immutable verified profile without operator paths.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebPlayerDescriptor' }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
        '404': { description: Profile is not configured. }
  /play/plugins/{id}/loader.js:
    get:
      operationId: getPlayerProfileLoader
      description: Authenticated immutable startup snapshot; requires read permission.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Hash-verified declared profile resource.
          content:
            text/javascript:
              schema: { type: string, format: binary }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
        '404': { description: Profile or resource is not configured. }
  /play/plugins/{id}/core.wasm:
    get:
      operationId: getPlayerProfileWasm
      description: Authenticated immutable startup snapshot; requires read permission.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Hash-verified declared profile resource.
          content:
            application/wasm:
              schema: { type: string, format: binary }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
        '404': { description: Profile or resource is not configured. }
  /play/plugins/{id}/assets/{name}:
    get:
      operationId: getPlayerProfileAsset
      description: Authenticated immutable startup snapshot; requires read permission.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Hash-verified declared profile resource.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { description: Authentication required. }
        '403': { description: Read permission required. }
        '404': { description: Profile or resource is not configured. }
  /api/v1/systems:
    get:
      operationId: listSystems
      responses:
        '200':
          description: Known system vocabulary. The catalog is not closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemList'
  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrap
      responses:
        '201':
          description: Owner created.
  /api/v1/auth/login:
    post:
      operationId: login
      responses:
        '200':
          description: Session created.
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Session revoked.
  /api/v1/access:
    get:
      operationId: getAccess
      responses:
        '200':
          description: Who may use this server without a token, and whether this connection may.
    put:
      operationId: putAccess
      responses:
        '200':
          description: Access rule replaced.
  /api/v1/users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: Accounts on this server.
    post:
      operationId: createUser
      responses:
        '201':
          description: User created.
  /api/v1/users/{userId}:
    patch:
      operationId: setPassword
      responses:
        '204':
          description: Password replaced.
  /api/v1/browse:
    get:
      operationId: browseLibrary
      description: Bounded authorized collection. Exactly one of libraryId or unassigned=true is required. Unknown systems use systemId=unknown. Authorization and category filtering precede paging. Cursors bind normalized query and actor; changed or vanished anchors require refresh.
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
        - { name: unassigned, in: query, schema: { type: boolean }, description: Actual owner only. }
        - { name: category, in: query, required: true, schema: { type: string, enum: [games, saves, media, system_files] } }
        - { name: rootId, in: query, schema: { type: string } }
        - { name: systemId, in: query, schema: { type: string } }
        - { name: systemIds, in: query, description: Comma-separated system identifiers; OR selection; takes precedence over systemId., schema: { type: string, maxLength: 12000 } }
        - { name: search, in: query, schema: { type: string, maxLength: 256 } }
        - { name: sort, in: query, schema: { type: string, enum: [name_asc, name_desc], default: name_asc } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Authorized page; at most the requested limit. No absolute filesystem paths.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryBrowsePage' }
        '400': { description: Invalid query or cursor. Refresh after a changed anchor. }
        '401': { description: Authentication required. }
        '403': { description: Read scope or owner authority required. }
        '404': { description: Scope or folder unavailable. }
  /api/v1/browse-libraries:
    get:
      operationId: browseLibraries
      description: Libraries discoverable through membership or live readable item grants. canCreateItems reflects current create policy.
      responses:
        '200':
          description: Accessible libraries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryList' }
  /api/v1/root-summaries:
    get:
      operationId: rootSummaries
      description: Actual owner only. Cached counts and scan/check state; performs no probes or scans. Optional libraryId and unassigned=true filters are exclusive.
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
        - { name: unassigned, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Cached folder summaries; missing check means unknown availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRootSummaryList' }
        '400': { description: Invalid filter. }
        '403': { description: Actual owner authority required. }
  /api/v1/libraries/{libraryId}:
    patch:
      operationId: renameLibrary
      description: Actual owner only. Renames a library without moving content.
      parameters:
        - { name: libraryId, in: path, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: 'Revision validator "rev-N".' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryDraft' }
      responses:
        '200':
          description: Renamed library.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '409': { description: Revision conflict. }
        '428': { description: Revision validator required. }
        '403': { description: Actual owner authority required. }
        '404': { description: Library unavailable. }
  /api/v1/roots/{rootId}/library:
    put:
      operationId: assignRoot
      description: Actual owner only. Assigns an unassigned folder in place; idempotent for the same target, rejects moving an assigned folder.
      parameters:
        - { name: rootId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RootLibraryAssignment' }
      responses:
        '200':
          description: Assigned folder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRoot' }
        '409': { description: Folder already assigned elsewhere. }
        '403': { description: Actual owner authority required. }
        '404': { description: Library or folder unavailable. }
  /api/v1/libraries:
    get:
      operationId: listLibraries
      responses:
        '200':
          description: Visible libraries.
    post:
      operationId: createLibrary
      responses:
        '201':
          description: Library created.
  /api/v1/libraries/{libraryId}/members:
    get:
      operationId: listLibraryMembers
      responses:
        '200':
          description: Library membership metadata, visible to library administrators.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryMemberList' }
  /api/v1/libraries/{libraryId}/members/{userId}:
    put:
      operationId: putMember
      responses:
        '204':
          description: Membership replaced.
    delete:
      operationId: deleteMember
      responses:
        '204':
          description: Membership removed.
  /api/v1/items:
    get:
      operationId: listItems
      responses:
        '200':
          description: Item page.
    post:
      operationId: createItem
      responses:
        '201':
          description: Item created.
  /api/v1/items/{itemId}:
    get:
      operationId: getItem
      responses:
        '200':
          description: Item.
    patch:
      operationId: patchItem
      responses:
        '200':
          description: Item updated.
    delete:
      operationId: deleteItem
      responses:
        '204':
          description: Item deleted.
  /api/v1/items/{itemId}/manifest:
    get:
      operationId: getManifest
      responses:
        '200':
          description: File manifest.
  /api/v1/items/{itemId}/access/{userId}:
    put:
      operationId: putItemAccess
      responses:
        '204':
          description: Item grant replaced.
    delete:
      operationId: deleteItemAccess
      responses:
        '204':
          description: Item grant removed.
  /api/v1/uploads:
    post:
      operationId: createUpload
      responses:
        '201':
          description: Upload session created.
  /api/v1/uploads/{uploadId}/content:
    put:
      operationId: uploadContent
      responses:
        '204':
          description: Bytes accepted.
  /api/v1/uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      responses:
        '201':
          description: Asset committed.
  /api/v1/uploads/{uploadId}:
    get:
      operationId: getUpload
      responses:
        '200':
          description: Received byte offset, so an interrupted upload can resume.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
    delete:
      operationId: abortUpload
      responses:
        '204':
          description: Upload aborted.
  /api/v1/files/{assetId}:
    get:
      operationId: getFileMetadata
      responses:
        '200':
          description: Asset metadata.
    delete:
      operationId: deleteFile
      responses:
        '204':
          description: Asset deleted.
  /api/v1/files/{assetId}/adopt:
    post:
      operationId: adoptFile
      responses:
        '200':
          description: The chosen save is now the live file at its path. The bytes it replaced stay beside it.
  /api/v1/files/{assetId}/content:
    get:
      operationId: getFileContent
      responses:
        '200':
          description: Full representation.
        '206':
          description: Single byte range.
    head:
      operationId: headFileContent
      responses:
        '200':
          description: Representation headers.
  /api/v1/files/{assetId}/entries:
    get:
      operationId: listVirtualEntries
      responses:
        '200':
          description: Virtual entries when a format provider exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualEntryList'
  /api/v1/files/{assetId}/entries/{entryId}/content:
    get:
      operationId: getVirtualEntryContent
      responses:
        '200':
          description: Full entry representation.
        '206':
          description: Single byte range of the entry.
    head:
      operationId: headVirtualEntryContent
      responses:
        '200':
          description: Entry representation headers.
  /api/v1/folders:
    get:
      operationId: browseFolders
      responses:
        '200':
          description: Directories inside one folder on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListing'
  /api/v1/webdav-credentials:
    get:
      operationId: listWebdavCredentials
      description: Account session only. Lists this account's credential metadata, never verifiers.
      responses:
        '200':
          description: Credentials including revoked entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebDavCredentialList'
    post:
      operationId: createWebdavCredential
      description: Account session only. Requires enabled WebDAV. Generates a read-only Digest app password shown once, without idempotency caching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebDavCredentialDraft'
      responses:
        '201':
          description: Credential issued. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebDavCredentialCreated'
  /api/v1/webdav-credentials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeWebdavCredential
      description: Account session only. Revokes a credential belonging to this account.
      responses:
        '204':
          description: Credential revoked.
  /api/v1/storage-locations:
    get:
      operationId: listStorageLocations
      description: Owner only. Includes server paths and current online status.
      responses:
        '200':
          description: Registered locations and the target for new bytes. Null means Primary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationList'
    post:
      operationId: createStorageLocation
      description: Owner only. Initializes blob storage in an existing server folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageLocationDraft'
      responses:
        '201':
          description: Location registered. Existing bytes are not moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocation'
  /api/v1/storage-locations/write-target:
    put:
      operationId: setStorageWriteTarget
      description: Owner only. Selects where new bytes are written; null selects Primary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageWriteTarget'
      responses:
        '200':
          description: Write target saved. An offline target refuses new uploads until online.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageWriteTarget'
  /api/v1/storage-locations/{locationId}:
    delete:
      operationId: deleteStorageLocation
      description: Owner only. Forgets an unused location without deleting files. The active target or a location holding catalog blobs returns 409.
      responses:
        '204':
          description: Location forgotten.
  /api/v1/roots:
    get:
      operationId: listContentRoots
      responses:
        '200':
          description: Saved content roots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRootList'
    post:
      operationId: createContentRoot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRootDraft'
      responses:
        '201':
          description: Content root saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRoot'
  /api/v1/roots/{rootId}:
    delete:
      operationId: deleteContentRoot
      responses:
        '204':
          description: Content root forgotten.
  /api/v1/roots/{rootId}/scan:
    post:
      operationId: scanContentRoot
      responses:
        '200':
          description: Folder read in place. Bytes stay where they are.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRootScan'
  /api/v1/sources:
    get:
      operationId: listSourceFiles
      responses:
        '200':
          description: Files found in content roots. Filesystem paths are not included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceFileList'
  /api/v1/matching/plugins:
    get:
      operationId: matchingPlugins
      responses:
        '200':
          description: Owner-only provider and manager registry. Installed modules are not executed by discovery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchingPluginList' }
  /api/v1/roots/{rootId}/watching-policy:
    get:
      operationId: folderWatchPolicy
      responses:
        '200':
          description: Owner-only watching preference and live status for a registered server folder. Disabled by default. Internal filesystem paths are not exposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderWatchPolicy' }
    put:
      operationId: setFolderWatchPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FolderWatchPolicyDraft' }
      responses:
        '200':
          description: Persist explicit owner consent and start or stop watching this server folder. Watching refreshes the index without moving files. Enable both registered folders to track moves between them. Periodic recovery scans handle missed events and unavailable native watches. Preference survives restart; runtime status does not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderWatchPolicy' }
  /api/v1/roots/{rootId}/organization-policy:
    get:
      operationId: sourceOrganizationPolicy
      responses:
        '200':
          description: Owner-only automatic organization policy for a registered source folder. Disabled by default. Internal filesystem paths are not exposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceOrganizationPolicy' }
    put:
      operationId: setSourceOrganizationPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceOrganizationPolicyDraft' }
      responses:
        '200':
          description: Owner explicitly enables future successful ROM, metadata and artwork match saves using a current organization preview bound to this source folder. Enabling does not process existing files. Disable at any time with enabled false. Policy fails closed if either folder changes library or path. Copy retains one verified owned copy and synchronizes later saved snapshots; move retains source identity. Unsupported files, stale sources and collisions leave saved matches intact and return an automatic organization warning.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceOrganizationPolicy' }
        '409':
          description: Preview expired or changed. Create a new preview before enabling.
  /api/v1/sources/{sourceId}/organization/preview:
    post:
      operationId: previewSourceOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceOrganizationDraft' }
      responses:
        '200':
          description: Owner-only, read-only preview for one local cartridge ROM. Destination is generated from system, saved title and original filename, within a registered root in the same library (including unassigned roots). Archives, disc sets and companions are unsupported. Copy supports different volumes; move requires the same volume. Preview is bound to owner, source, roots, saved matches and file validators, expires after ten minutes and may be discarded when the bounded preview cache fills. Preview itself does not organize files. A separate explicit root policy can enable automatic organization on future saved matches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceOrganizationPreview' }
        '409':
          description: Unsupported source, changed source, destination collision or cross-volume move. Preview again after resolving the conflict.
  /api/v1/sources/{sourceId}/organization/apply:
    post:
      operationId: applySourceOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceOrganizationApply' }
      responses:
        '200':
          description: Applies exactly the owner's single-use preview with exclusive no-overwrite placement and revalidation. Move retains the source ID and saved match snapshots. Copy creates a source with cloned selections and leaves the original intact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceOrganizationResult' }
        '409':
          description: Preview expired, consumed, or changed. No new paths are accepted. Preview again.
  /api/v1/sources/{sourceId}/matches:
    post:
      operationId: findSourceMatches
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchingOptions' }
      responses:
        '200':
          description: Owner-requested suggestions from local and optionally online providers. Original files and catalog metadata are unchanged. Preview expires after fifteen minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMatches' }
  /api/v1/sources/{sourceId}/matches/selections:
    get:
      operationId: sourceMatchSelections
      parameters:
        - { name: includeArtworkRoles, in: query, schema: { type: boolean, default: false }, description: Include all artwork roles; older clients should keep the default front-only result. }
      responses:
        '200':
          description: Saved matches visible to the source reader. Selected metadata becomes game metadata; binary companions retain their source-kind access restrictions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMatchSelections' }
    put:
      operationId: saveSourceMatch
      parameters:
        - { name: includeArtworkRoles, in: query, schema: { type: boolean, default: false }, description: Include all artwork roles in the response; older clients should keep the default front-only result. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceMatchSelectionDraft' }
      responses:
        '200':
          description: Owner-selected match and optional immutable content snapshot persisted. A repeated candidate ID is idempotent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMatchSelections' }
        '409':
          description: Revision conflict or source/companion changed since lookup.
  /api/v1/sources/{sourceId}/matches/selections/{kind}:
    delete:
      operationId: removeSourceMatch
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
          description: Current saved matching revision as a quoted rev-N ETag.
        - { name: artworkRole, in: query, schema: { type: string, enum: [front, back, disc, manual, title, screenshot, other] }, description: Artwork role to remove; defaults to front. }
        - { name: includeArtworkRoles, in: query, schema: { type: boolean, default: false }, description: Include all artwork roles in the response; older clients should keep the default front-only result. }
      responses:
        '200':
          description: Owner removed a selection; original files remain unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMatchSelections' }
  /api/v1/sources/{sourceId}/matches/selections/{kind}/content:
    get:
      operationId: selectedMatchContent
      parameters:
        - { name: artworkRole, in: query, schema: { type: string, enum: [front, back, disc, manual, title, screenshot, other] }, description: Artwork role content to retrieve; defaults to front. }
      responses:
        '200':
          description: Authorized immutable artwork, patch, or disabled RetroArch cheat file snapshot.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /api/v1/sources/{sourceId}/matches/{requestId}/artwork/{candidateId}:
    get:
      operationId: matchingArtwork
      responses:
        '200':
          description: Owner-authorized raster preview of a candidate in a live matching request. No remote credentials or redirects.
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /api/v1/sources/{sourceId}/group:
    get:
      operationId: sourceGroup
      responses:
        '200':
          description: Cached members of one disc group, authorized individually.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceGroup' }
  /api/v1/sources/{sourceId}/bundle:
    get:
      operationId: sourceBundle
      responses:
        '200':
          description: Streaming ZIP64 archive of a complete, current disc group. Original relative layout is preserved. No ranges.
          content:
            application/zip:
              schema: { type: string, format: binary }
        '409':
          description: Incomplete or changed disc group; rescan before retrying.
  /api/v1/sources/{sourceId}/content:
    get:
      operationId: readSourceContent
      responses:
        '200':
          description: Bytes of a local source file. Nothing is copied into the blob store.
    head:
      operationId: statSourceContent
      responses:
        '200':
          description: Size of a local source file.
  /api/v1/changes:
    get:
      operationId: listChanges
      responses:
        '200':
          description: Change feed.
  /api/v1/guest-grants:
    get:
      operationId: listGuestGrants
      responses:
        '200':
          description: Guest grants, including revoked ones. The token and its hash are omitted.
    post:
      operationId: createGuestGrant
      responses:
        '201':
          description: Guest grant created. The token is returned once.
  /api/v1/guest-grants/{grantId}:
    delete:
      operationId: revokeGuestGrant
      responses:
        '204':
          description: Guest grant revoked.
  /api/v1/device-tokens:
    get:
      operationId: listDeviceTokens
      responses:
        '200':
          description: Acting user's device token metadata, never hashes or token secrets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceTokenList' }
    post:
      operationId: createDeviceToken
      responses:
        '201':
          description: Device token created.
  /api/v1/device-tokens/{tokenId}:
    delete:
      operationId: revokeDeviceToken
      responses:
        '204':
          description: Device token revoked.
  /api/v1/audit:
    get:
      operationId: listAudit
      responses:
        '200':
          description: Audit events.
  /api/v1/library-jobs:
    get:
      operationId: listLibraryJobs
      description: Owner-only shared jobs, newest identifier first. Bounded keyset pages.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 99}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Shared jobs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryJobList'}
    post:
      operationId: createLibraryJob
      description: Owner-only durable scan or matching job. Reuses covering active work with identical options. Partially overlapping work returns 409. Survives request disconnects. No scope selects all registered roots.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryJobDraft'}
      responses:
        '200':
          description: Existing covering job.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryJobResponse'}
        '202':
          description: Shared job queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryJobResponse'}
        '409': {description: Overlapping shared work already exists.}
  /api/v1/library-jobs/{jobId}:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getLibraryJob
      description: Owner-only progress aggregates, shared by every session.
      responses:
        '200':
          description: Shared job.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryJobResponse'}
  /api/v1/library-jobs/{jobId}/items:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string}}
    get:
      operationId: listLibraryJobItems
      description: Owner-only bounded results for review; sourceId names a root for scan jobs.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 99}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [pending, saved, review, unmatched, failed, skipped, reviewed]}}
      responses:
        '200':
          description: Job results.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryJobItemList'}
  /api/v1/library-jobs/{jobId}/cancel:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string}}
    post:
      operationId: cancelLibraryJob
      description: Owner-only cancel from any owner session. Resume continues pending work; completed results are preserved. Interrupted work requires explicit resume.
      responses:
        '200':
          description: Shared job.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryJobResponse'}
  /api/v1/library-jobs/{jobId}/resume:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string}}
    post:
      operationId: resumeLibraryJob
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                retry: {type: string, enum: [failed, unmatched]}
      description: Owner-only resume from any owner session. Resume continues pending work; completed results are preserved. Interrupted work requires explicit resume.
      responses:
        '200':
          description: Shared job.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryJobResponse'}
  /api/v1/library-jobs/{jobId}/items/{sourceId}/reviewed:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string}}
      - {name: sourceId, in: path, required: true, schema: {type: string}}
    post:
      operationId: reviewLibraryJobItem
      description: Owner-only acknowledgement of a completed result. Shared across sessions; does not select or save any candidate.
      responses:
        '200':
          description: Shared job progress after review.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryJobResponse'}
components:
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: [string, 'null'] }
        instance: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
    Capabilities:
      type: object
      required: [protocol, minClientVersion, features, limits, authentication]
      properties:
        protocol: { $ref: '#/components/schemas/ProtocolInfo' }
        minClientVersion: { type: string }
        features: { $ref: '#/components/schemas/FeatureFlags' }
        limits: { $ref: '#/components/schemas/Limits' }
        authentication:
          type: array
          items: { type: string }
        bootstrapped: { type: boolean }
    ProtocolInfo:
      type: object
      required: [major, minor, path]
      properties:
        major: { type: integer }
        minor: { type: integer }
        path: { type: string }
    FeatureFlags:
      type: object
      required: [rangeRequests, multiRange, resumableUploads, changeFeed, guestGrants, virtualFormats, webdav, natTraversal]
      properties:
        rangeRequests: { type: boolean }
        multiRange: { type: boolean }
        resumableUploads: { type: boolean }
        changeFeed: { type: boolean }
        guestGrants: { type: boolean }
        virtualFormats:
          type: array
          items: { type: string }
        webdav: { type: boolean }
        natTraversal: { type: boolean }
        webPlayback: { type: boolean }
    PlayerCoreResource:
      type: object
      required: [url, sha256, sizeBytes]
      properties:
        url: { type: string, description: Fixed same-origin protected resource path. }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 67108864 }
    PlayerCoreDescriptor:
      type: object
      required: [version, id, name, systems, runtime, threaded, filesystem, saveCompletion, frontendCommit, coreCommit, emscriptenVersion, contentExtension, maxContentBytes, loader, wasm]
      properties:
        version: { type: integer, enum: [1] }
        id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
        name: { type: string, maxLength: 80 }
        systems:
          type: array
          items: { type: string, enum: [com.provenance.nes] }
        runtime: { type: string, enum: [retroarch-emscripten-esm] }
        threaded: { type: boolean, enum: [false] }
        filesystem: { type: string, enum: [memfs] }
        saveCompletion: { type: string, enum: [command-reply-v1] }
        frontendCommit: { type: string, enum: [4d4bfc0fbaacca30d433e5c11b0b2b5242141b66] }
        coreCommit: { type: string, enum: [ac0d00a7fc01166f84c7bac01d1084ebfd2b865e] }
        emscriptenVersion: { type: string, enum: [3.1.46] }
        contentExtension: { type: string, enum: [nes] }
        maxContentBytes: { type: integer, format: int64, minimum: 1, maximum: 67108864 }
        loader: { $ref: '#/components/schemas/PlayerCoreResource' }
        wasm: { $ref: '#/components/schemas/PlayerCoreResource' }
    WebPlayerAsset:
      type: object
      required: [name, url, sha256, sizeBytes]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$' }
        url: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 33554432 }
    WebPlayerDescriptor:
      type: object
      required: [profileVersion, id, name, systems, runtime, filesystem, threaded, saveCompletion, contentExtensions, maxContentBytes, buildVersion, loader, wasm, assets]
      properties:
        profileVersion: { type: integer, enum: [1] }
        id: { type: string, maxLength: 120, pattern: '^(?:[a-z0-9][a-z0-9_-]{0,63}|[a-z0-9]+(?:\.[a-z0-9-]+)+)$' }
        name: { type: string, maxLength: 80 }
        systems: { type: array, items: { type: string }, minItems: 1, maxItems: 64 }
        runtime: { type: string, enum: [emscripten-esm-v1, retroarch-emscripten-esm, dolphin-wasm-esm] }
        filesystem: { type: string, enum: [memfs] }
        systemFilesDirectory: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$', maxLength: 64, description: Optional single folder below the emulator system directory for all named support files. }
        threaded: { type: boolean, description: True only for the isolated Dolphin runtime. }
        saveCompletion: { type: string, enum: [none, command-reply-v1] }
        contentExtensions: { type: array, items: { type: string }, minItems: 1, maxItems: 32 }
        maxContentBytes: { type: integer, format: int64, minimum: 1, maximum: 9663676416, description: "Up to 9 GiB for disk-backed Dolphin; other runtimes remain limited to 512 MiB." }
        buildVersion: { type: string, maxLength: 128 }
        loader: { $ref: '#/components/schemas/PlayerCoreResource' }
        wasm: { $ref: '#/components/schemas/PlayerCoreResource' }
        assets: { type: array, items: { $ref: '#/components/schemas/WebPlayerAsset' }, maxItems: 16 }
      allOf:
        - if: { properties: { runtime: { const: dolphin-wasm-esm } } }
          then: { properties: { threaded: { const: true }, saveCompletion: { const: none } } }
          else: { properties: { threaded: { const: false } } }
    PlayerIsolationDraft:
      type: object
      additionalProperties: false
      required: [profileId]
      properties:
        profileId: { type: string, minLength: 1, maxLength: 120 }
    PlayerIsolationSession:
      type: object
      additionalProperties: false
      required: [id, url, expiresAt]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{48}$' }
        url: { type: string, format: uri, pattern: '^http://127\.0\.0\.1:[0-9]{1,5}/[a-f0-9]{48}/dolphin-sandbox\.html$' }
        expiresAt: { type: string, format: date-time }
    PlayerConfiguration:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        default: { type: boolean }
    PlayerInstallation:
      type: object
      required: [profile, enabled, source, removable]
      properties:
        profile: { $ref: '#/components/schemas/WebPlayerDescriptor' }
        enabled: { type: boolean }
        source: { type: string, enum: [managed, operator] }
        removable: { type: boolean }
    PlayerCatalogEntry:
      type: object
      required: [id, name, systems, description, available, reason, downloadBytes]
      properties:
        id: { type: string }
        name: { type: string }
        systems: { type: array, items: { type: string } }
        description: { type: string }
        available: { type: boolean }
        reason: { type: [string, 'null'] }
        downloadBytes: { type: [integer, 'null'] }
    PlayerManagement:
      type: object
      required: [items, defaultProfileId, available]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlayerInstallation' } }
        defaultProfileId: { type: [string, 'null'] }
        available: { type: array, items: { $ref: '#/components/schemas/PlayerCatalogEntry' } }
    WebPlayerCatalog:
      type: object
      required: [items, defaultProfileId]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WebPlayerDescriptor' }, maxItems: 64 }
        defaultProfileId: { type: [string, 'null'] }
    Limits:
      type: object
      required: [maxUploadBytes, maxPageSize]
      properties:
        maxUploadBytes: { type: integer, format: int64 }
        maxPageSize: { type: integer }
    SystemSummary:
      type: object
      required: [identifier, name]
      properties:
        identifier: { type: string }
        name: { type: string }
    SystemList:
      type: object
      required: [systems, closed]
      properties:
        systems:
          type: array
          items: { $ref: '#/components/schemas/SystemSummary' }
        closed: { type: boolean }
    Library:
      type: object
      required: [id, name, ownerId, revision, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        canCreateItems: { type: boolean, description: Present on browse-libraries; current permission to create global items. }
        ownerId: { type: string }
        revision: { type: integer }
        createdAt: { type: string }
    LibraryList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Library' }
        nextCursor: { type: [string, 'null'] }
    LibraryDraft:
      type: object
      required: [name]
      properties:
        name: { type: string }
    FolderEntry:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
    FolderPlace:
      type: object
      required: [label, path]
      properties:
        label:
          type: string
        path:
          type: string
    FolderListing:
      type: object
      required: [path, parent, entries, places]
      properties:
        path:
          type: string
        parent:
          type: [string, 'null']
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FolderEntry'
        places:
          type: array
          items:
            $ref: '#/components/schemas/FolderPlace'
    WebDavCredential:
      type: object
      required: [id, name, username, createdAt, expiresAt, revokedAt]
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    WebDavCredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WebDavCredential' }
    WebDavCredentialDraft:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expiresInSeconds: { type: integer, minimum: 60, maximum: 31536000, default: 7776000 }
    WebDavCredentialCreated:
      type: object
      required: [credential, password]
      properties:
        credential: { $ref: '#/components/schemas/WebDavCredential' }
        password: { type: string }
    StorageLocation:
      type: object
      required: [id, path, label, createdAt, online]
      properties:
        id: { type: string }
        path: { type: string }
        label: { type: string }
        createdAt: { type: string }
        online: { type: boolean }
    StorageLocationList:
      type: object
      required: [items, writeLocationId]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StorageLocation' }
        writeLocationId: { type: [string, 'null'] }
    StorageLocationDraft:
      type: object
      required: [path, label]
      properties:
        path: { type: string }
        label: { type: string }
    StorageWriteTarget:
      type: object
      required: [id]
      properties:
        id: { type: [string, 'null'] }
    ContentRoot:
      type: object
      required: [id, path, label, libraryId, createdAt]
      properties:
        id: { type: string }
        path: { type: string }
        label: { type: string }
        libraryId: { type: [string, 'null'] }
        createdAt: { type: string }
    ContentRootList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentRoot' }
        nextCursor: { type: [string, 'null'] }
    ContentRootDraft:
      type: object
      required: [path, label]
      properties:
        path: { type: string }
        label: { type: string }
        libraryId: { type: [string, 'null'] }
    ContentRootScan:
      type: object
      required: [rootId, medium, online, count]
      properties:
        rootId: { type: string }
        medium: { type: string }
        online: { type: boolean }
        count: { type: integer }
    SourceFile:
      type: object
      required:
        [id, rootId, libraryId, name, kind, size, systemId, availability, medium, contentPath]
      properties:
        id: { type: string }
        rootId: { type: string }
        libraryId: { type: [string, 'null'] }
        name: { type: string }
        kind: { type: string }
        size: { type: integer, format: int64 }
        systemId: { type: [string, 'null'] }
        availability: { type: string }
        medium: { type: string }
        title: { type: string }
        artworkAvailable: { type: boolean }
        groupFileCount: { type: integer, minimum: 0, maximum: 512 }
        groupError: { type: [string, 'null'] }
        contentPath: { type: string }
    MatchingPlugin:
      type: object
      required: [id, name, kind, capabilities, network]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [provider, manager] }
        capabilities:
          type: array
          items: { type: string, enum: [rom, metadata, artwork, patch, cheats] }
        network: { type: boolean }
    MatchingPluginList:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          items: { $ref: '#/components/schemas/MatchingPlugin' }
    FolderWatchPolicy:
      type: object
      required: [rootId, enabled, state]
      properties:
        rootId: { type: string }
        enabled: { type: boolean }
        state: { type: string, enum: [off, watching, polling, offline, scanning, error] }
        lastScanAt: { type: string, format: date-time }
        warning: { type: string }
    FolderWatchPolicyDraft:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    SourceOrganizationPolicy:
      type: object
      required: [sourceRootId, enabled]
      properties:
        sourceRootId: { type: string }
        enabled: { type: boolean }
        mode: { type: string, enum: [copy, move] }
        targetRootId: { type: string }
        enabledAt: { type: string, format: date-time }
    SourceOrganizationPolicyDraft:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        planId: { type: string, description: Required when enabling. A current owner-bound organization preview for a source in this folder. }
    AutomaticOrganizationOutcome:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [copied, moved, synchronized, skipped, failed] }
        sourceId: { type: string }
