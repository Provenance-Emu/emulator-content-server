      requestBody:
        required: true
        content:
          application/json:
            example: { title: "Example Game (USA)", systemId: "com.provenance.nes" }
            schema: { $ref: '#/components/schemas/SourceLookupHints' }
      responses:
        '200':
          description: Owner lookup hints saved. Changed hints make the indexed game eligible for automatic lookup when enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMatchSelections' }
        '409':
          description: The matching revision changed. Reload saved matches before editing.
