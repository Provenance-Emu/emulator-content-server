      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [scan, match]}
        rootId: {type: string}
        libraryId: {type: string}
        unassigned: {type: boolean}
        options: {$ref: '#/components/schemas/MatchingOptions'}
    LibraryJob:
      type: object
      required: [id, kind, scope, options, state, total, processed, saved, review, unmatched, failed, skipped, currentSourceId, error, createdAt, updatedAt, interruptedCount]
      properties:
        id: {type: string}
        kind: {type: string, enum: [scan, match]}
        scope: {$ref: '#/components/schemas/LibraryJobScope'}
        options: {$ref: '#/components/schemas/MatchingOptions'}
        state: {type: string, enum: [queued, running, completed, failed, cancelled, interrupted]}
        total: {type: integer}
        processed: {type: integer}
        saved: {type: integer}
        review: {type: integer}
        unmatched: {type: integer}
        failed: {type: integer}
        skipped: {type: integer}
        currentSourceId: {type: [string, 'null']}
        error: {type: [string, 'null']}
        createdAt: {type: string}
        updatedAt: {type: string}
        interruptedCount: {type: integer}
        providerFailures:
          type: integer
          minimum: 1
          description: Games in a match job whose lookup sources could not all be reached. Absent when none.
    LibraryOverview:
      type: object
      required: [automaticMatching, folders]
      properties:
        automaticMatching: {type: boolean, description: Whether the server fills missing details and covers after a scan.}
        folders: {type: array, items: {$ref: '#/components/schemas/LibraryOverviewFolder'}}
    LibraryOverviewFolder:
      type: object
      required: [rootId, label, libraryId, games, withDetails, withCover, unavailable, automatic]
      properties:
        rootId: {type: string}
        label: {type: string}
        libraryId: {type: [string, 'null']}
        games: {type: integer, minimum: 0}
        withDetails: {type: integer, minimum: 0}
        withCover: {type: integer, minimum: 0}
        unavailable: {type: integer, minimum: 0, description: Games whose file was offline or not downloaded when last seen.}
        automatic:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [none, waiting, queued, complete, unchanged]
              description: none - no automatic activity this session. waiting - evaluation is pending. queued - a matching batch was created. complete - nothing is missing. unchanged - no game was eligible for this pass.
            checkedAt: {type: string}
            jobId: {type: string}
            jobState: {type: string, enum: [queued, running, completed, failed, cancelled, interrupted]}
            processed: {type: integer, minimum: 0}
            total: {type: integer, minimum: 0}
            review: {type: integer, minimum: 0}
            unmatched: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            providerFailures: {type: integer, minimum: 0}
            stoppedJobId: {type: string, description: An interrupted matching job covering this folder.}
          example:
            state: queued
            jobId: job-example
            jobState: running
            processed: 18
            total: 50
            review: 2
            unmatched: 3
            failed: 0
            providerFailures: 1
    LibraryJobResponse:
      type: object
      required: [job]
      properties:
        job: {$ref: '#/components/schemas/LibraryJob'}
        reused: {type: boolean}
    LibraryJobList:
      type: object
      required: [jobs, nextCursor]
      properties:
        jobs: {type: array, items: {$ref: '#/components/schemas/LibraryJob'}}
        nextCursor: {type: [string, 'null']}
    LibraryJobItem:
      type: object
      required: [sourceId, status, saved, suggestions, error]
      properties:
