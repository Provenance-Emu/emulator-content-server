<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated emulator</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;display:grid;place-items:center}canvas{display:block;width:100%;height:100%;object-fit:contain}canvas:focus-visible{outline:2px solid #89bfe2;outline-offset:-2px}</style></head><body><canvas width="640" height="480" tabindex="0" aria-label="Game display"></canvas><script>
'use strict';
(() => {
  const nonce = location.hash.slice(1);
  if (!/^[a-f0-9]{32}$/.test(nonce) || parent === window) return;
  const LIMIT = 64 * 1024 * 1024;
  let contentLimit = LIMIT;
  const contentSizes = new Map();
  let contentBytes = 0;
  const canvas = document.querySelector('canvas');
  const SHOT_LIMIT = 8*1024*1024, PREVIEW_LIMIT = 2*1024*1024;
  const PREVIEW_PATH = '/ecs/states/game.state.png';
  let frames=0, renderer='', context, pendingShot;
  let shaderErrors=0;
  let shaderBaseline=0,shaderState={selection:'off',status:'off'};
  let coreOptionsAvailable=false;
  let inputAdapter;
  let display={fit:'contain',aspect:'auto',filter:'pixelated'};
  const originalGetContext=canvas.getContext.bind(canvas);
  canvas.getContext=(kind,attributes)=>{
    const webgl=['webgl','webgl2','experimental-webgl'].includes(kind);
    const ctx=originalGetContext(kind,webgl?{...attributes,preserveDrawingBuffer:true}:attributes);
    if(ctx){renderer=kind;context=ctx;}return ctx;
  };
  function validDisplay(s){return s && ['contain','fill'].includes(s.fit) && ['auto','4:3','16:9','1:1'].includes(s.aspect) && ['pixelated','smooth'].includes(s.filter);}
  function applyDisplay(){
    let width=innerWidth,height=innerHeight;
    const ratio=display.aspect==='auto'?(canvas.width/canvas.height||4/3):display.aspect.split(':').reduce((a,b)=>a/Number(b));
    if(display.fit==='contain'){width=Math.min(width,height*ratio);height=width/ratio;}
    const styles={width:width+'px',height:height+'px',objectFit:'fill',imageRendering:display.filter==='pixelated'?'pixelated':'auto'};
    for(const [key,value] of Object.entries(styles))if(canvas.style[key]!==value)canvas.style[key]=value;
  }
  addEventListener('resize',applyDisplay);
  function validPng(bytes,limit){
    if(!(bytes instanceof Uint8Array)||bytes.length<45||bytes.length>limit||![137,80,78,71,13,10,26,10].every((b,i)=>bytes[i]===b))return false;
    const v=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),w=v.getUint32(16),h=v.getUint32(20);
    if(v.getUint32(8)!==13||v.getUint32(12)!==0x49484452||!w||!h||w>8192||h>8192||w*h>16777216)return false;
    let data=false,count=0;
    for(let o=8;o+12<=bytes.length;){const n=v.getUint32(o),t=v.getUint32(o+4);if(++count>4096||n>bytes.length-o-12)return false;const end=o+n+12;if(t===0x49444154&&n)data=true;if(t===0x49454e44)return n===0&&end===bytes.length&&data;o=end;}return false;
  }
  function canCapture(){return frames>0 && (renderer==='2d'||context?.getContextAttributes?.()?.preserveDrawingBuffer===true);}
  function capture(){
    if(!canCapture())throw Error('Capture unavailable until the core draws a supported frame');
    if(canvas.width<1||canvas.height<1||canvas.width>8192||canvas.height>8192||canvas.width*canvas.height>16777216)throw Error('Capture dimensions exceed limit');
    return new Promise((resolve,reject)=>{
      let settled=false;
      const timer=setTimeout(()=>finish(Error('No new game frame available for capture')),5000);
      function finish(error,bytes){if(settled)return;settled=true;clearTimeout(timer);pendingShot=undefined;error?reject(error):resolve(bytes);}
      pendingShot={reject:()=>finish(Error('Capture cancelled')),draw(){
        if(settled)return;pendingShot=undefined;
        try{if(canvas.width<1||canvas.height<1||canvas.width>8192||canvas.height>8192||canvas.width*canvas.height>16777216)throw Error('Capture dimensions exceed limit');canvas.toBlob(async png=>{try{if(!png||png.size>SHOT_LIMIT)throw Error('Invalid capture size');const bytes=new Uint8Array(await png.arrayBuffer());if(closed||!validPng(bytes,SHOT_LIMIT))throw Error('Invalid capture PNG');finish(null,bytes.buffer);}catch(error){finish(error);}},'image/png');}catch(error){finish(error);}
      }};
    });
  }
  async function preview(){
    if(typeof runtime.FS.unlink!=='function')return null;
    const deadline=Date.now()+3000;let previous;
    while(!closed&&Date.now()<deadline){
      try{if(runtime.FS.stat&&runtime.FS.stat(PREVIEW_PATH).size>PREVIEW_LIMIT)return null;const bytes=await runtime.FS.readFile(PREVIEW_PATH);if(validPng(bytes,PREVIEW_LIMIT)){if(previous?.length===bytes.length&&bytes.every((b,i)=>previous[i]===b))return new Uint8Array(bytes).buffer;previous=new Uint8Array(bytes);}else previous=undefined;}catch{previous=undefined;}
      await new Promise(resolve=>setTimeout(resolve,50));
    }return null;
  }
  let port, runtime, closed = false, initializing = false, tail = Promise.resolve();
  const urls = new Set();
  const byteArray = (value, limit = LIMIT) => {
    if (!(value instanceof ArrayBuffer) || value.byteLength > limit) throw Error('Invalid runtime bytes');
    return new Uint8Array(value);
  };
  const path = (value) => {
    if (typeof value !== 'string' || value.length > 256 || !/^\/ecs(?:\/[A-Za-z0-9_.-]+)*$/.test(value) || value.split('/').some(part => part === '..' || part === '.')) throw Error('Invalid virtual path');
    return value;
  };
  let logStart = Date.now(), logCount = 0;
  const log = (value) => {
    if(/shader|glsl/i.test(String(value))&&/error|fail/i.test(String(value)))shaderErrors++;
    if (closed || !port) return;
    if (Date.now() - logStart > 1000) { logStart = Date.now(); logCount = 0; }
    if (++logCount <= 30) port.postMessage({type:'log',text:String(value).slice(0,500)});
  };
  const blob = (bytes,type) => { const url = URL.createObjectURL(new Blob([bytes],{type})); urls.add(url); return url; };
  const shaderHooks=()=>['_cmd_set_shader','stringToNewUTF8','_free'].every(key=>typeof runtime[key]==='function');
  function nativeShader(id){const pointer=runtime.stringToNewUTF8(id==='off'?'':'/ecs/shaders/'+id+'.glslp');if(!pointer)throw Error('Shader allocation failed');try{return !!runtime._cmd_set_shader(pointer);}finally{runtime._free(pointer);}}
  function recoverShader(){try{if(nativeShader('off'))return {selection:'off',status:'failed'};}catch{}return {selection:null,status:'failed'};}
  async function operation(message) {
    if (message.op === 'init') {
      if (initializing || runtime) throw Error('Runtime already initialized');
      initializing = true;
      const spec = message.value;
      contentLimit = spec.maxContentBytes ?? LIMIT;
      if (!Number.isSafeInteger(contentLimit) || contentLimit < 1 || contentLimit > 512*1024*1024) throw Error('Invalid content limit');
      const loader = byteArray(spec.loader,8*1024*1024), wasm = byteArray(spec.wasm);
      // Necessary markers, not proof of support: old builds export save helpers too.
      // Avoid issuing a query known to be absent; actual replies still need validation.
      const contains=(bytes,text)=>{const needle=new TextEncoder().encode(text);for(let i=bytes.indexOf(needle[0]);i>=0;i=bytes.indexOf(needle[0],i+1)){if(needle.every((b,n)=>bytes[i+n]===b))return true;}return false;};
      coreOptionsAvailable=['GET_CORE_OPTION','SET_CORE_OPTION'].every(text=>contains(wasm,text)||contains(loader,text));
      if (!Array.isArray(spec.assets) || spec.assets.length > 16) throw Error('Invalid runtime resources');
      const resources = new Map(), binaries = new Map();
      let total = 0;
      for (const entry of spec.assets) {
        if (!entry || typeof entry.name !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/.test(entry.name) || resources.has(entry.name)) throw Error('Invalid resource name');
        const bytes = byteArray(entry.bytes,32*1024*1024); total += bytes.byteLength;
        if (total > 32*1024*1024) throw Error('Runtime resources exceed limit');
        binaries.set(entry.name,bytes); resources.set(entry.name,blob(bytes,'application/octet-stream'));
      }
      const wasmUrl = blob(wasm,'application/wasm');
      if(spec.inputEnabled===true){
        if(typeof spec.inputModule!=='string'||spec.inputModule.length>131072)throw Error('Invalid input adapter');
        const input=await import(blob(new TextEncoder().encode(spec.inputModule),'text/javascript'));
        inputAdapter=input.default(canvas,spec.inputConfig,input.createEngine);
      }
      const module = await import(blob(loader,'text/javascript'));
      if (typeof module.default !== 'function') throw Error('An Emscripten ES-module factory is required');
      runtime = await module.default({
        wasmBinary:wasm,canvas,noInitialRun:true,noExitRuntime:true,
        locateFile(name) {
          const short = String(name).replace(/^\.\//,'');
          if (resources.has(short)) return resources.get(short);
          if (/^[A-Za-z0-9_.-]+\.wasm$/.test(short)) return wasmUrl;
          throw Error('Undeclared runtime resource');
        },
        getPreloadedPackage(name) { const bytes=binaries.get(String(name).replace(/^\.\//,'')); if (!bytes) throw Error('Undeclared data package'); return bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength); },
        print:log,printErr:log,
      });
      if (!runtime?.FS || typeof runtime.FS.mkdirTree !== 'function' || typeof runtime.FS.writeFile !== 'function' || typeof runtime.FS.readFile !== 'function' || typeof runtime.callMain !== 'function') throw Error('Runtime needs MEMFS and callMain exports');
      if (spec.commands && (typeof runtime.EmscriptenSendCommand !== 'function' || typeof runtime.EmscriptenReceiveCommandReply !== 'function')) throw Error('Runtime needs command/reply save exports');
      if(!spec.shaders||Object.keys(spec.shaders).length!==2)throw Error('Invalid shader resources');
      await runtime.FS.mkdirTree('/ecs/shaders');
      for(const id of ['scanlines','lcd']){
        const source=spec.shaders[id];if(typeof source!=='string'||source.length>16384)throw Error('Invalid shader source');
        await runtime.FS.writeFile('/ecs/shaders/'+id+'.glsl',new TextEncoder().encode(source));
        await runtime.FS.writeFile('/ecs/shaders/'+id+'.glslp',new TextEncoder().encode('shaders = "1"\nshader0 = "'+id+'.glsl"\nfilter_linear0 = "false"\n'));
      }
      const previousPostMainLoop=runtime.postMainLoop;
      runtime.postMainLoop=function(){previousPostMainLoop?.call(runtime);frames++;applyDisplay();pendingShot?.draw();inputAdapter?.afterFrame();};
      return null;
    }
    if (!runtime) throw Error('Runtime is not initialized');
    const value = message.value;
    switch (message.op) {
      case 'mkdir': await runtime.FS.mkdirTree(path(value)); return null;
      case 'write': {
        const target=path(value.path), content=target.startsWith('/ecs/content/');
        const bytes=byteArray(value.bytes,content ? contentLimit : LIMIT);
        const total=contentBytes-(contentSizes.get(target)??0)+bytes.byteLength;
        if(content && (total>contentLimit || (!contentSizes.has(target)&&contentSizes.size>=128)))throw Error('Complete disc exceeds runtime content limit');
        await runtime.FS.writeFile(target,bytes);
        if(content){contentBytes=total;contentSizes.set(target,bytes.byteLength);}return null;
      }
      case 'read': {
        const bytes = await runtime.FS.readFile(path(value));
        if (!(bytes instanceof Uint8Array) || bytes.byteLength > LIMIT) throw Error('Runtime output exceeds limit');
        return new Uint8Array(bytes).buffer;
      }
      case 'main': if (!Array.isArray(value) || value.length > 16 || value.some(arg => typeof arg !== 'string' || arg.length > 256)) throw Error('Invalid runtime arguments'); await runtime.callMain(value);inputAdapter?.start();return null;
      case 'input-info': return inputAdapter?.info()??{supported:false,ready:false,devices:[],assignments:[null,null,null,null],states:Array.from({length:4},()=>({buttons:0,axes:[0,0,0,0]})),deviceError:null,capture:null};
      case 'input-disable': inputAdapter?.dispose();inputAdapter=null;return null;
      case 'input-config': if(!inputAdapter)throw Error('Input adapter unavailable');inputAdapter.configure(value.map,value.assignments,value.assignmentPort);return null;
      case 'input-capture': if(!inputAdapter)throw Error('Input adapter unavailable');inputAdapter.capture(value);return null;
      case 'send': {
        const key=s=>typeof s==='string'&&/^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$/.test(s)&&!['__proto__','constructor','prototype'].includes(s);
        const option=s=>typeof s==='string'&&s.length>0&&s.length<=512&&s.trim()===s&&!/[\x00-\x1f\x7f"\\|]/.test(s);
        if(typeof value!=='string'||value.length>660)throw Error('Invalid core command');
        const query=/^GET_CORE_OPTION(?: ([^ ]+))?$/.exec(value),set=/^SET_CORE_OPTION ([^ ]+) (.+)$/.exec(value);
        if(!['SAVE_FILES','SAVE_STATE_SLOT 0','LOAD_STATE_SLOT 0'].includes(value)&&!(query&&(query[1]===undefined||key(query[1])))&&!(set&&key(set[1])&&option(set[2])))throw Error('Invalid core option command');

      }
      case 'receive': {
        const reply = await runtime.EmscriptenReceiveCommandReply();

      }
      case 'screenshot': return await capture();
      case 'preview-clear': {
        if(typeof runtime.FS.unlink!=='function')return false;
        try{await runtime.FS.unlink(PREVIEW_PATH);}catch(error){if(error?.errno!==44&&error?.code!=='ENOENT')throw error;}

      }
      case 'preview': return await preview();
      case 'display-info': return {width:canvas.width,height:canvas.height,captureReady:canCapture(),preview:typeof runtime.FS.unlink==='function',settings:display};
      case 'display': if(!validDisplay(value))throw Error('Invalid display settings');display={fit:value.fit,aspect:value.aspect,filter:value.filter};applyDisplay();return null;
      case 'settings-info': {
        // Recheck after the initial frame window: deferred compilation can fail later.
        if(shaderState.status==='requested'&&shaderErrors!==shaderBaseline)shaderState=recoverShader();
        return {commands:coreOptionsAvailable&&typeof runtime.EmscriptenSendCommand==='function'&&typeof runtime.EmscriptenReceiveCommandReply==='function',shaders:shaderHooks(),shaderResult:shaderState};
      }
      case 'shader': {
        if(!['off','scanlines','lcd'].includes(value)||!shaderHooks())throw Error('Unsupported shader operation');
        try{
          const errors=shaderErrors,start=frames;shaderBaseline=errors;
          if(!nativeShader(value))throw Error('Shader rejected');
          if(value==='off')return shaderState={selection:'off',status:'off'};
          const end=Date.now()+5000;
          while(frames<start+3&&Date.now()<end&&!closed)await new Promise(resolve=>setTimeout(resolve,20));
          if(closed||frames<start+3||shaderErrors!==errors)throw Error('Shader did not render cleanly');
          return shaderState={selection:value,status:'requested'};
        }catch{
          return shaderState=recoverShader();
        }
      }
      case 'focus': canvas.focus(); return null;
      default: throw Error('Unknown runtime operation');
    }
  }
  function connect(event) {
    if (event.source !== parent || !event.data || event.data.type !== 'ecs-player-connect' || event.data.nonce !== nonce || event.ports.length !== 1 || port) return;
    removeEventListener('message',connect);
    port = event.ports[0];
    port.onmessage = event => {
      const message = event.data;
      if(message?.type==='input'&&!closed){try{inputAdapter?.packet(message.value);}catch{log('Invalid input packet; controls released');}return;}
      if (!message || !Number.isSafeInteger(message.id) || message.id < 1 || typeof message.op !== 'string' || closed) return;
      tail = tail.then(async () => {
        try { const value = await operation(message); if (!closed) port.postMessage({type:'result',id:message.id,value},value instanceof ArrayBuffer ? [value] : []); }
        catch { if (!closed) port.postMessage({type:'result',id:message.id,error:'Emulator operation failed or returned unsupported data'}); }
      });
    };
    port.start();
    port.postMessage({type:'connected'});
  }
  addEventListener('message',connect);
  addEventListener('pagehide',()=>{closed=true;inputAdapter?.dispose();pendingShot?.reject();port?.close();for(const url of urls)URL.revokeObjectURL(url);},{once:true});
  parent.postMessage({type:'ecs-player-ready',nonce},'*');
})();
</script></body></html>
