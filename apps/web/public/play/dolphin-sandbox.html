<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Dolphin game display</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;outline:none}</style></head><body><canvas id="canvas" tabindex="0" aria-label="Game display"></canvas><script type="module">

</script></body></html>
