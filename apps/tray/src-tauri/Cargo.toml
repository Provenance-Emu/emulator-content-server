[package]
name = "ecs-tray"
version = "0.1.1"
description = "Menu-bar status for the emulator content server"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Keep these aligned with the JavaScript plugins in ../package.json.
tauri-plugin-opener = "=2.5.1"
tauri-plugin-process = "=2.3.1"

tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Tauri turns this on for a production bundle so the webview has no devtools.
custom-protocol = ["tauri/custom-protocol"]
