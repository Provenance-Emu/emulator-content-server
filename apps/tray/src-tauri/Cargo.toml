[package]
name = "ecs-tray"
version = "0.1.0"
description = "Menu-bar status for the emulator content server"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"

[features]
# Tauri turns this on for a production bundle so the webview has no devtools.
custom-protocol = ["tauri/custom-protocol"]
